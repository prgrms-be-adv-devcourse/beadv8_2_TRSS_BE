server:
  port: ${DELIVERY_PORT:8085}   # 로컬에서 다른 서비스(8080·8082·8084)와 같이 띄울 수 있게 다른 포트를 쓴다

spring:
  application:
    name: delivery-service

  # 프로젝트 루트의 .env를 읽음 (없으면 무시). bootRun은 모듈 폴더에서 실행되므로 상위 폴더도 찾는다
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # delivery 스키마만 쓴다. 운영에서는 delivery_user(자기 스키마 권한만 가진 계정)로 접속한다
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palette}?currentSchema=delivery
    username: ${DELIVERY_DB_USERNAME:${DB_USERNAME:delivery_user}}
    password: ${DELIVERY_DB_PASSWORD:${DB_PASSWORD:delivery_user}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 바꾸고, 엔티티와 다르면 앱 시작을 막는다.

  # 새 스키마라 운영 이전(baseline) 없이 모든 환경에서 V1부터 실행한다
  flyway:
    schemas: delivery
    default-schema: delivery

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Outbox 릴레이가 이벤트 봉투를 발행하는 Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                   # 브로커가 기록을 마친 뒤에 성공으로 본다(그때 outbox를 PUBLISHED로 바꿈)
      properties:
        enable.idempotence: true  # 프로듀서 재시도로 같은 메시지가 두 번 기록되지 않게
        max.block.ms: 5000        # 브로커가 없을 때 send가 오래 막히지 않게(기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record            # 메시지 하나를 처리(커밋)한 뒤에 offset을 커밋한다

  task:
    scheduling:
      pool:
        size: 1          # 스케줄 작업이 outbox 릴레이 하나뿐이다. 배송 추적 스케줄러를 추가할 때 작업 수만큼 늘린다


# 정책 값. 코드에 숫자를 직접 쓰지 않고 각 컨텍스트의 <Ctx>Policy에서 읽는다.
custom:
  jwt:
    # 서명 키: 모든 서비스가 같은 값을 쓴다. 기본값 없이 환경변수(.env)로만 주입한다.
    secret: ${JWT_SECRET}
    accessTokenExpireMinutes: 30          # Access Token 유효 시간(분)
  internal:
    # 서비스 간 호출(/internal/**) 인증 키. X-Internal-Key 헤더로 보낸다. 모든 서비스가 같은 값을 쓰고, 기본값 없이 환경변수(.env)로만 주입한다.
    # delivery가 받는 내부 API(/internal/v1/deliveries) 검사에 쓴다
    apiKey: ${INTERNAL_API_KEY}
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}   # 프론트 주소(쉼표로 구분)
  outbox:
    relayEnabled: true          # false면 릴레이 스케줄러를 등록하지 않는다(테스트에서 끔: src/test/resources/application.properties)
    relayIntervalMillis: 1000   # Outbox 릴레이 실행 간격(밀리초). 이벤트가 리스너에 닿기까지 최대 이만큼 늦어진다
    relayBatchSize: 100         # 릴레이가 한 번에 발행하는 최대 이벤트 수
    maxRetryCount: 5            # 발행 실패를 이 횟수만큼 겪으면 FAILED로 두고 더 이상 발행하지 않는다(Kafka가 내려가 있는 건 세지 않음)
    sendTimeoutMillis: 10000    # Kafka 브로커의 기록 확인(ack)을 기다리는 최대 시간(밀리초)
    topicPartitions: 3          # 이벤트 토픽(<대상>.events) 파티션 수. 같은 aggregateId는 같은 파티션으로 가서 순서가 지켜진다
  kafka:
    consumer:
      # 컨슈머가 실패한 메시지를 다시 처리하는 방식. 기본값이면 1·2·4·8초 간격으로 4번 더 처리하고(총 5번), 그래도 실패하면 <토픽>-dlt로 보낸다
      maxRetries: 4                     # 처음 처리 뒤 다시 처리하는 횟수
      retryInitialIntervalMillis: 1000  # 첫 재시도 전 대기(밀리초)
      retryMultiplier: 2.0              # 재시도마다 대기 시간에 곱하는 값
  scheduling:
    enabled: true        # false면 모든 스케줄러가 멈춘다(통합 테스트용)
