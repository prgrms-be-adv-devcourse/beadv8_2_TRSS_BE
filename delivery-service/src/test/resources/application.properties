# 테스트 전용 설정. main의 application.yaml에 더해 함께 읽힌다.
# 릴레이 스케줄러를 끈다. 켜 두면 스케줄러가 켜진 테스트 컨텍스트의 릴레이가 다른 테스트가 막 저장한 PENDING 이벤트를 먼저 발행해 버린다.
# 릴레이가 필요한 테스트는 OutboxRelay.relayPending()을 직접 부른다.
custom.outbox.relayEnabled=false

# 내부 API 키. 테스트는 .env 없이도 뜨도록 고정 값을 쓴다.
custom.internal.apiKey=test-internal-api-key

# Delivery Tracker. 테스트는 실제 API를 부르지 않는다(가짜 DeliveryTracker 빈, MockRestServiceServer).
# 실수로 실제 클라이언트가 불려도 외부로 나가지 않게 apiUrl을 닿지 않는 로컬 주소로 둔다.
custom.deliveryTracker.apiUrl=http://localhost:1/graphql
custom.deliveryTracker.clientId=test
custom.deliveryTracker.clientSecret=test
custom.deliveryTracker.callbackBaseUrl=http://localhost:8085/webhooks/delivery-tracker
custom.deliveryTracker.callbackToken=test-callback-token-0123456789abcdef

# 기동할 때 NewTopic(delivery.events)을 만들지 않는다. Kafka가 없는 환경(CI)에서 컨텍스트마다 관리 클라이언트 대기 시간이 붙지 않게.
# 토픽 생성 확인은 DeliveryKafkaTopicConfigTest가 EmbeddedKafka로 켜서 한다.
spring.kafka.admin.auto-create=false

# 테스트 콜백 주소는 http(localhost)라 https 검사 예외를 켠다. 서버에서는 켜지 않는다(DeliveryTrackerPolicy)
custom.deliveryTracker.allowInsecureCallback=true
