# 테스트 전용 설정. main의 application.yaml에 더해 함께 읽힌다.
# 내부 API 키. 테스트는 .env 없이도 뜨도록 고정 값을 쓴다.
custom.internal.apiKey=test-internal-api-key

# OpenAI 키. 테스트는 실제 OpenAI를 부르지 않는다(테스트 설정의 가짜 EmbeddingModel이 대신한다)
spring.ai.openai.api-key=test-key

# 임베딩 스케줄러를 끈다. 스케줄러를 보는 테스트는 RecommendFacade를 직접 부른다
custom.scheduling.enabled=false

# 회원 서비스. 테스트는 실제 회원 서비스를 부르지 않는다
# 실수로 불려도 로컬에 떠 있는 회원 서비스에 닿지 않게 닿지 않는 주소로 둔다
custom.member.baseUrl=http://localhost:1
