server:
  port: ${PAYMENT_PORT:8083}   # 로컬에서 루트 모놀리스(8080)·market(8082)과 같이 띄울 수 있게 다른 포트를 쓴다

spring:
  application:
    name: payment-service

  # 프로젝트 루트의 .env를 읽음 (없으면 무시). bootRun은 모듈 폴더에서 실행되므로 상위 폴더도 찾는다
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # payment 스키마만 쓴다. payment_user(자기 스키마 권한만 가진 계정)로 접속한다
  # 기본값은 로컬 compose(infra/compose.yaml)의 계정과 같고, 개발 서버는 환경변수로 주입한다
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palette}?currentSchema=payment
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_user}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 바꾸고, 엔티티와 다르면 앱 시작을 막는다.

  flyway:
    schemas: payment
    default-schema: payment
    # 운영 DB: 테이블을 public에서 payment로 옮긴 뒤 처음 뜰 때 V1(baseline)은 이미 적용된 것으로 기록하고 V2부터 실행한다
    # 빈 DB(로컬·CI·새 서버): V1부터 실행한다
    baseline-on-migrate: true
    baseline-version: 1

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Outbox 릴레이가 이벤트 봉투를 발행하고, 결제 컨슈머가 가입 이벤트(member.events)를 받는 Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                   # 브로커가 기록을 마친 뒤에 성공으로 본다(그때 outbox를 PUBLISHED로 바꿈)
      properties:
        enable.idempotence: true  # 프로듀서 재시도로 같은 메시지가 두 번 기록되지 않게
        max.block.ms: 5000        # 브로커가 없을 때 send가 오래 막히지 않게(기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record            # 메시지 하나를 처리(커밋)한 뒤에 offset을 커밋한다

  task:
    scheduling:
      pool:
        size: 3          # 스케줄 작업(충전 2, outbox 릴레이 1)이 서로 기다리지 않게 작업 수만큼


# 정책 값. 코드에 숫자를 직접 쓰지 않고 각 컨텍스트의 <Ctx>Policy에서 읽는다.
custom:
  jwt:
    # 서명 키: 모든 서비스가 같은 값을 쓴다. 기본값 없이 환경변수(.env)로만 주입한다.
    secret: ${JWT_SECRET}
    accessTokenExpireMinutes: 30          # Access Token 유효 시간(분)
  internal:
    # 서비스 간 호출(/internal/**) 인증 키. X-Internal-Key 헤더로 보낸다. 모든 서비스가 같은 값을 쓰고, 기본값 없이 환경변수(.env)로만 주입한다.
    # 결제가 받는 내부 API(/internal/v1/payments) 검사와, 결제가 회원 내부 API를 부를 때 모두 쓴다
    apiKey: ${INTERNAL_API_KEY}
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}   # 프론트 주소(쉼표로 구분)
  payment:
    topupUnit: 10000           # 충전 단위·최소 금액(원)
    topupMax: 1000000          # 1회 최대 충전 금액(원)
    topupReadyExpireMinutes: 15   # 결제창 진행 전(READY) 충전 건 만료 시간(분)
    topupExpireIntervalSeconds: 60      # READY 만료 스케줄러 실행 간격(초)
    topupReconcileIntervalSeconds: 300  # PROCESSING 결과 확인 스케줄러 실행 간격(초)
    topupReconcileDelayMinutes: 5       # PROCESSING이 된 뒤 토스에 다시 확인하기까지 기다리는 시간(분). 토스 응답 대기(30초)보다 충분히 길게
    topupReconcileBatchSize: 100        # 결과 확인 스케줄러가 한 번에 처리하는 최대 건수
    adminMemberId: 1           # 수수료(FEE)를 받는 관리자 회원 ID (시드 1번)
    # 회원 기능은 회원 내부 API(/internal/v1/members)를 HTTP로 부른다
    memberBaseUrl: ${MEMBER_SERVICE_URL:http://localhost:8080}   # 회원 서비스 주소. 회원은 아직 루트 앱(8080)에 있다
    memberConnectTimeoutSeconds: 2   # 회원 서비스 접속 제한 시간(초)
    memberReadTimeoutSeconds: 5      # 요청 후 회원 서비스 응답 대기 제한 시간(초)
  member:
    # 개발용 시드 비밀번호. 회원 서비스와 같은 환경변수로, 있을 때만 결제 시드(PaymentDataInit: 정산 시드용 홀딩)를 넣는다(운영은 비움)
    seedPassword: ${MEMBER_SEED_PASSWORD:}
  # 토스페이먼츠 결제 API. 시크릿 키는 환경변수로 주입하고, 없으면 토스 호출할 때만 실패한다.
  toss:
    baseUrl: https://api.tosspayments.com
    secretKey: ${TOSS_SECRET_KEY:}
    connectTimeoutSeconds: 5   # 토스 서버 접속 제한 시간(초)
    readTimeoutSeconds: 30     # 요청 후 토스 응답 대기 제한 시간(초). 넘으면 충전 건을 PROCESSING으로 두고, 스케줄러가 토스 조회로 최종 결과를 반영
  outbox:
    relayEnabled: true          # false면 릴레이 스케줄러를 등록하지 않는다(테스트에서 끔: src/test/resources/application.properties)
    relayIntervalMillis: 1000   # Outbox 릴레이 실행 간격(밀리초). 이벤트가 리스너에 닿기까지 최대 이만큼 늦어진다
    relayBatchSize: 100         # 릴레이가 한 번에 발행하는 최대 이벤트 수
    maxRetryCount: 5            # 발행 실패를 이 횟수만큼 겪으면 FAILED로 두고 더 이상 발행하지 않는다(Kafka가 내려가 있는 건 세지 않음)
    sendTimeoutMillis: 10000    # Kafka 브로커의 기록 확인(ack)을 기다리는 최대 시간(밀리초)
    topicPartitions: 3          # 이벤트 토픽(<대상>.events) 파티션 수. 같은 aggregateId는 같은 파티션으로 가서 순서가 지켜진다
  kafka:
    consumer:
      # 컨슈머가 실패한 메시지를 다시 처리하는 방식. 기본값이면 1·2·4·8초 간격으로 4번 더 처리하고(총 5번), 그래도 실패하면 <토픽>-dlt로 보낸다
      maxRetries: 4                     # 처음 처리 뒤 다시 처리하는 횟수
      retryInitialIntervalMillis: 1000  # 첫 재시도 전 대기(밀리초)
      retryMultiplier: 2.0              # 재시도마다 대기 시간에 곱하는 값
  scheduling:
    enabled: true        # false면 모든 스케줄러가 멈춘다(통합 테스트용)
