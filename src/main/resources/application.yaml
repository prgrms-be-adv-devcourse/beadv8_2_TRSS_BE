spring:
  application:
    name: palette

  # 프로젝트 루트의 .env를 읽음 (없으면 무시). 형식은 .env.example 참고
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palette}
    username: ${DB_USERNAME:palette}
    password: ${DB_PASSWORD:palette}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # 인증 메일 발송(Gmail SMTP). 계정 정보는 환경변수로 주입하고, 없으면 발송할 때만 실패한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  batch:
    jdbc:
      initialize-schema: always

# 정책 값. 코드에 숫자를 직접 쓰지 않고 각 컨텍스트의 <Ctx>Policy에서 읽는다.
custom:
  jwt:
    # 서명 키: 무작위 32바이트를 Base64로 인코딩한 값(openssl rand -base64 32). 로컬 개발용 기본값이며, 배포 환경에서는 반드시 JWT_SECRET으로 바꾼다.
    secret: ${JWT_SECRET:AnGlh3QBPrBhUdJ7H87lXb1zgI2l7B818fVnAXpscfE=}
    accessTokenExpireMinutes: 30          # Access Token 유효 시간(분)
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}   # 프론트 주소(쉼표로 구분)
  member:
    refreshTokenExpireDays: 14            # Refresh Token 유효 기간(일)
    seedPassword: ${MEMBER_SEED_PASSWORD:}   # 개발용 시드 회원 비밀번호. 비어 있으면 시드를 넣지 않는다(운영 환경)
    refreshCookieSecure: ${AUTH_COOKIE_SECURE:false}       # HTTPS 배포 시 true
    refreshCookieSameSite: ${AUTH_COOKIE_SAME_SITE:Lax}    # 프론트·백엔드 도메인이 다르면 None (Secure 필수)
    emailCodeExpireMinutes: 5             # 이메일 인증코드 유효 시간(분)
    emailCodeResendSeconds: 60            # 인증코드 재발송 제한 간격(초)
    emailVerifiedTokenExpireMinutes: 30   # 인증 완료 토큰 유효 시간(분)
    emailCodeMaxAttempts: 5               # 인증코드 확인 최대 실패 횟수
    # 정산 계좌번호 암호화 키. 기본값은 개발용이고, 운영은 환경변수로 덮어쓴다.
    accountEncryption:
      password: ${ACCOUNT_ENCRYPTION_PASSWORD:palette-dev-account-key}
      salt: ${ACCOUNT_ENCRYPTION_SALT:5c0744940b5c369b}
  order:
    cartMaxQuantity: 99        # 장바구니 최대 수량
    expireMinutes: 15          # 주문 생성 후 결제 제한 시간(분)
    autoConfirmDays: 7         # 결제 후 자동 구매 확정(일)
  payment:
    topupUnit: 10000           # 충전 단위·최소 금액(원)
    topupMax: 1000000          # 1회 최대 충전 금액(원)
    topupReadyExpireMinutes: 15   # 결제창 진행 전(READY) 충전 건 만료 시간(분)
    adminMemberId: 1           # 수수료(FEE)를 받는 관리자 회원 ID (시드 1번)
  settlement:
    feeRate: 10                # 수수료율(%)
    payDayOfMonth: 10          # 매월 정산일
    maxAttempts: 3             # 최초 1회 + 재시도 2회
    retryIntervalMinutes: 10   # 재시도 간격(분)
