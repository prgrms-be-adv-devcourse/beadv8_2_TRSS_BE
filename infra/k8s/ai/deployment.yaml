# ai-service(AI 추천·FAQ 챗봇)를 k3s에서 돌리는 설정(TRSS-327). compose.prod.yaml에 있던 ai 블록을 옮긴 것이다.
#
# 적용은 배포 스크립트(infra/scripts/deploy.sh)가 한다. 두 자리를 바꿔 넣는다:
#   IMAGE_TAG : ai 이미지 태그(빌드한 커밋 SHA)
#   ENV_HASH  : Secret(.env) 내용의 지문. .env만 바뀌어도 이 값이 바뀌어 파드가 새 값으로 다시 뜬다
# 손으로 적용할 때: sed -e "s/IMAGE_TAG/<태그>/" -e "s/ENV_HASH/manual/" infra/k8s/ai/deployment.yaml | kubectl apply -f -
# 이미지는 레지스트리에서 받지 않고 서버에서 빌드해 k3s에 직접 넣는다(docker save | sudo k3s ctr images import -).
# 환경변수·비밀값은 서버 infra/.env로 만든 Secret(ai-env)에서 읽는다. Secret은 레포에 두지 않는다.
# .env를 그대로 넣으면 안 된다(--from-env-file은 값을 감싼 따옴표까지 값으로 넣고, 같은 이름이 두 번 있으면 Compose와 다르게 읽는다).
# 대신 Docker Compose가 해석한 값(config --environment)에서 .env에 있는 이름만 골라 넣는다. Compose 앱이 받는 값과 똑같아진다:
#   kubectl -n palette create secret generic ai-env \
#     --from-env-file=<(docker compose -f infra/compose.prod.yaml config --environment \
#       | grep -E "^($(grep -oE '^[A-Za-z_][A-Za-z0-9_]*' infra/.env | sort -u | paste -sd'|'))=") \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: palette
  labels:
    app: ai
spec:
  # replicas를 적지 않는다. 파드 수는 HPA(최소 1·최대 2)가 정한다.
  # 여기에 적어 두면 배포 때마다(apply) 그 숫자로 되돌아가, HPA가 늘려 둔 파드가 줄어든다
  selector:
    matchLabels:
      app: ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드를 하나 더 띄워 준비가 끝난 뒤에 옛 파드를 내린다. 배포 중에도 받을 파드가 늘 있다
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai
      annotations:
        # Secret이 바뀌어도 쿠버네티스는 떠 있는 파드에 새 값을 넣지 않는다. 지문이 바뀌면 파드 설정이 바뀐 걸로 보고 롤링 업데이트한다
        palette/env-hash: "ENV_HASH"
    spec:
      # 쿠버네티스는 같은 네임스페이스 Service마다 AI_PORT=tcp://… 같은 옛날 방식 환경변수를 파드에 자동으로 넣는다.
      # 앱 설정 server.port=${AI_PORT:8087}과 이름이 겹쳐 앱이 못 뜨므로 끈다. Service는 이름·NodePort로 부르고 이 변수를 쓰지 않는다
      enableServiceLinks: false
      # 종료 신호를 받으면 처리 중인 요청을 끝내고 꺼질 시간. Spring 기본 대기(30초) + preStop(10초)보다 길게
      terminationGracePeriodSeconds: 45
      containers:
        - name: ai
          image: palette-ai:IMAGE_TAG
          # 레지스트리가 없다. 서버에 넣어 둔 이미지만 쓰고, 없으면 받으러 가지 않고 바로 실패해 원인이 잘 보이게 한다
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8087
            # actuator(health·prometheus) 관리 포트(Dockerfile의 MANAGEMENT_SERVER_PORT)
            - name: management
              containerPort: 9091
          envFrom:
            # infra/.env 전체(OpenAI 키, DB 비밀번호 등). compose의 env_file: .env와 같다
            - secretRef:
                name: ai-env
          env:
            # 아래 $(DATA_HOST)에서 쓰려고 먼저 꺼내 둔다(쿠버네티스는 앞에서 정의한 변수만 $(이름)으로 풀어 준다)
            - name: DATA_HOST
              valueFrom:
                secretKeyRef:
                  name: ai-env
                  key: DATA_HOST
            - name: DB_HOST
              value: $(DATA_HOST)
            - name: DB_PORT
              value: "5432"
            # 챗봇 회원별 요청 횟수를 Redis에 둔다
            - name: REDIS_HOST
              value: $(DATA_HOST)
            - name: REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-env
                  key: REDIS_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: $(DATA_HOST):9092
            # 크리에이터 추천이 인플루언서 승인 여부를 회원 서비스 내부 API로 확인한다.
            # member는 Compose에 있어서 이름(member)으로는 못 찾는다. 앱 서버 내부 IP에 연 포트로 부른다
            - name: MEMBER_SERVICE_URL
              value: http://10.0.1.122:8081
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: native
            # 운영은 gateway가 넘긴 회원 헤더만 받는다(common JwtTokenFilter)
            - name: CUSTOM_AUTH_ACCEPTBEARERTOKEN
              value: "false"
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            # /actuator/health/liveness·readiness를 켠다. Spring이 쿠버네티스를 알아채면 저절로 켜지지만 감지에 기대지 않고 적어 둔다
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            # 추적을 보낼 Tempo(TRSS-335). Dockerfile 기본값(tempo:4318)은 Compose 이름이라 여기서 못 찾는다. 앱 서버 내부 IP에 연 포트로 보낸다
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: http://10.0.1.122:4318/v1/traces
          resources:
            requests:
              # "최소 이만큼은 잡아 둔다". 합이 서버 메모리를 넘으면 파드가 아예 안 뜨므로 실측(약 430MB) 근처로 둔다
              memory: 450Mi
              cpu: 100m
            limits:
              # 넘으면 강제 종료. compose의 mem_limit(768m)과 같다. 힙은 이 값의 75%(Dockerfile MaxRAMPercentage)
              memory: 768Mi
              # CPU 상한은 두지 않는다. 걸면 바쁠 때 앱이 느려지기만 하고, 서버 CPU는 다른 앱과 나눠 쓴다
          # 처음 뜰 때만 쓰는 검사. 통과하기 전에는 아래 liveness가 돌지 않아, 뜨는 데 오래 걸려도 재시작되지 않는다.
          # 앱 여러 개가 같이 뜨면 2~3분 걸린 적이 있어(compose 주석) 최대 5분(10초 × 30번) 기다린다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 30
          # 요청을 받을 준비가 됐는지. 실패하면 이 파드로 요청을 보내지 않는다(재시작은 안 함).
          # 롤링 업데이트가 "새 파드 준비 → 옛 파드 내림"을 지키는 기준이다
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          # 살아 있는지. 계속 실패하면(멈춤 등) 쿠버네티스가 파드를 다시 띄운다
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # 파드를 내릴 때, Service가 이 파드로 요청 보내기를 멈출 때까지 잠깐 기다린 뒤 종료 신호를 받게 한다.
            # 안 기다리면 이미 꺼지는 파드로 요청이 몇 개 들어가 실패할 수 있다(배포 중 끊김)
            preStop:
              exec:
                command: ["sleep", "10"]
