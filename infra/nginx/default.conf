# 외부 요청(80, HTTPS 적용 후 443)을 받아 백엔드 경로는 Spring 앱으로 넘기고, 나머지는 프론트 빌드 파일로 응답한다.
#   회원 경로 → member(member:8081), 상품·주문 경로 → market(market:8082), 결제 경로 → payment(payment:8083),
#   정산 경로 → settlement(settlement:8084), 물류·배송 웹훅 경로 → delivery(delivery:8085),
#   알림 경로 → notification(notification:8086), 그 밖의 백엔드 경로 → payment
# 앱 주소 변수와 location은 위 포트 순서대로 적는다.
# 서비스가 분리될 때마다 그 서비스 경로를 따로 빼서 넘긴다. (gateway가 생기면 이 분기는 gateway로 옮긴다)
# HTTPS(palette-shop.duckdns.org, Let's Encrypt 인증서)는 두 번에 나눠 붙인다.
#   nginx는 설정에 적힌 인증서 파일이 없으면 아예 뜨지 않으므로, 인증서를 먼저 받고 443을 연다.
#   1) 지금: 80에서 발급 확인용 경로(/.well-known/acme-challenge/)를 열어 둔다 → 서버에서 certbot으로 인증서 발급
#   2) 다음: 발급된 인증서로 443(ssl)을 연다

# WebSocket 요청(Upgrade 헤더가 있음)이면 Connection: upgrade, 일반 요청이면 close로 넘긴다
# conf.d에 들어가는 파일이라 이 자리가 http 블록 안이다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;           # 응답 헤더에 nginx 버전을 노출하지 않는다
    client_max_body_size 60m;    # 요청 본문 최대 크기. 상품 이미지 대표 1장 + 상세 10장 (spring.servlet.multipart.max-request-size와 같게)

    # 앱으로 넘길 때 붙이는 헤더. 아래 proxy_pass 하는 location들이 함께 쓴다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;      # 토스 응답 대기(30초)보다 길게

    # Docker 내부 DNS. 앱·grafana 주소를 nginx 시작할 때가 아니라 요청할 때 찾는다.
    # 찾은 주소는 5초 동안 재사용한다. 배포로 앱 IP가 바뀌면 이 시간 동안만 옛 IP로 가서 502가 날 수 있어 짧게 둔다(내부 DNS라 부담이 거의 없다)
    # ipv6=off : Docker 네트워크는 IPv4만 쓰므로 IPv6(AAAA) 주소는 묻지 않는다
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 앱 주소. upstream 블록 대신 변수로 두어 proxy_pass가 요청할 때 주소를 찾게 한다.
    #   - 배포로 앱 컨테이너가 다시 만들어져 IP가 바뀌어도 reload 없이 5초 안에 새 IP로 보낸다
    #   - 앱 하나가 없어도 nginx는 뜨고, 그 앱 경로만 502가 난다(upstream이면 nginx 전체가 시작하지 못한다)
    # 주소 뒤에 경로를 붙이지 않는다. 붙이면 요청 경로가 바뀌어 넘어간다
    set $member       http://member:8081;
    set $market       http://market:8082;
    set $payment      http://payment:8083;
    set $settlement   http://settlement:8084;
    set $delivery     http://delivery:8085;
    set $notification http://notification:8086;

    # 프론트 빌드 결과(dist). compose.prod.yaml에서 서버의 ~/palette-web을 연결한다.
    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt가 도메인 주인인지 확인하려고 http로 가져가는 파일. certbot이 이 폴더에 써 둔다.
    # 발급할 때와 90일마다 갱신할 때 모두 쓰므로 HTTPS 리다이렉트를 붙여도 http로 남겨 둔다.
    # ^~ : 아래 정규식 location보다 먼저 고르고, 파일이 없으면 프론트 화면 대신 404를 준다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Delivery Tracker가 배송 상태가 바뀔 때 부르는 웹훅(delivery-service). 주소 끝이 비밀 토큰이다.
    # access_log off : 접근 로그(→ Loki)에 토큰이 든 주소가 남지 않게 한다. 앱도 이 경로는 토큰을 로그에 찍지 않는다.
    # ^~ : 아래 정규식 location보다 먼저 고른다. 없으면 맨 아래 프론트 화면(location /)이 받아 index.html을 준다.
    location ^~ /webhooks/delivery-tracker/ {
        access_log off;
        proxy_pass $delivery;
    }

    # 서비스별 경로는 포트 순서(member 8081 → market 8082 → payment 8083 → settlement 8084 → delivery 8085 → notification 8086)로 적는다
    # 정규식 location은 위에서부터 고르므로 아래의 /api/ 전체 규칙보다 먼저 둔다
    # (seller/·admin/ 아래는 서비스마다 나뉘어 있어 경로를 하나씩 적는다)

    # 내 쿠폰 사용 내역은 users/ 아래지만 쿠폰 데이터가 market에 있다
    # 바로 아래 member 규칙(users)에 먼저 걸리지 않도록 member 규칙보다 위에 따로 둔다
    location ~ ^/api/v1/users/me/coupon-usages(/|$) {
        proxy_pass $market;
    }

    # member-service 경로: 인증·회원·판매자 (판매자 본인 정보, 관리자 회원·판매자 관리 포함)
    # seller/ 아래 상품·주문 항목(market)과 정산(settlement)은 각자의 규칙에서 고른다
    location ~ ^/api/v1/(auth|users|sellers|seller/me|admin/users|admin/sellers)(/|$) {
        proxy_pass $member;
    }

    # market-service 경로: 상품, 카테고리, 장바구니, 주문, 찜, 리뷰, 쿠폰, 협약 (판매자, 인플루언서, 관리자용 포함)
    # influencer/(단수, 인플루언서 전용 pick, 팔레트, 협약, 쿠폰)는 market이고, influencers/(복수, 신청, 검색)는 member다
    location ~ ^/api/v1/(products|categories|cart|orders|wishlist|reviews|coupons|influencer|seller/products|seller/order-items|seller/partnerships|seller/coupons|admin/products|admin/categories|admin/product-stop-requests|admin/coupons|admin/partnerships)(/|$) {
        proxy_pass $market;
    }

    # payment-service 경로: 예치금 지갑·충전, 관리자 결제·충전 조회
    location ~ ^/api/v1/(wallet|topups|admin/payments|admin/topups)(/|$) {
        proxy_pass $payment;
    }

    # settlement-service 경로: 관리자 정산·정산 후보, 판매자 정산 조회
    # 서비스 간 호출(/internal/**)은 Docker 내부망으로 직접 부르므로 여기서 열지 않는다
    location ~ ^/api/v1/(admin/settlements|admin/settlement-candidates|seller/settlements)(/|$) {
        proxy_pass $settlement;
    }

    # delivery-service 경로: 물류 담당자(LOGISTICS)의 배송 조회·송장 등록·송장 수정
    # 구매자의 배송 정보는 market 주문 상세가 delivery 내부 API로 받아 함께 내려준다
    location ~ ^/api/v1/logistics(/|$) {
        proxy_pass $delivery;
    }

    # notification-service 경로: 구매자 알림 목록·안 읽은 개수·읽음 처리
    location ~ ^/api/v1/notifications(/|$) {
        proxy_pass $notification;
    }

    # Swagger 화면(swagger 컨테이너). /swagger-ui를 떼지 않고 넘긴다(compose.prod.yaml의 BASE_URL)
    # ^~ : 아래 정규식 location(/api/·/v3/api-docs)보다 먼저 고른다
    # 끝에 /가 없으면 여기서 붙인다. 컨테이너에 맡기면 자기 포트(:8080)를 붙인 주소로 보내 화면이 안 열린다
    location = /swagger-ui { return 301 /swagger-ui/; }
    location ^~ /swagger-ui/ {
        set $swagger http://swagger:8080;
        proxy_pass $swagger;
    }

    # 서비스별 Swagger 문서. /v3/api-docs/{서비스} → 그 서비스의 /v3/api-docs
    # Swagger 화면의 서비스 선택 드롭다운이 이 주소를 읽는다 (compose.prod.yaml swagger의 URLS)
    # = : 정확히 같은 경로라 아래 정규식 location보다 먼저 고른다. 변수 proxy_pass에 경로를 붙이면 그 경로로 바꿔 넘긴다
    location = /v3/api-docs/member       { proxy_pass $member/v3/api-docs; }
    location = /v3/api-docs/market       { proxy_pass $market/v3/api-docs; }
    location = /v3/api-docs/payment      { proxy_pass $payment/v3/api-docs; }
    location = /v3/api-docs/settlement   { proxy_pass $settlement/v3/api-docs; }
    location = /v3/api-docs/delivery     { proxy_pass $delivery/v3/api-docs; }
    location = /v3/api-docs/notification { proxy_pass $notification/v3/api-docs; }

    # 그 밖의 백엔드 경로는 payment로 넘긴다 (루트 모놀리스가 없어져 기본 대상을 payment로 바꿨다)
    # /v3/api-docs는 scripts/deploy.sh의 nginx 확인이 쓴다
    location ~ ^/(api/|v3/api-docs) {
        proxy_pass $payment;
    }

    # 로그 모니터링 화면(Grafana). /grafana를 떼지 않고 그대로 넘긴다(GF_SERVER_SERVE_FROM_SUB_PATH=true).
    # ^~ : 이 경로는 위의 정규식 location보다 먼저 고른다
    # 실시간 기능(/grafana/api/live/)의 WebSocket도 여기서 함께 받는다.
    # location 안에서 proxy_set_header를 하나라도 정하면 server의 공통 헤더를 물려받지 않으므로 전부 다시 적는다.
    location ^~ /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
    }

    # /images: 프론트 파일(로고·배너 등)이 있으면 그 파일을, 없으면 market이 저장한 상품 이미지를 준다
    location /images/ {
        try_files $uri @market;
    }

    location @market {
        proxy_pass $market;
    }

    # 빌드 파일은 이름에 내용 해시가 붙어서 오래 캐시해도 된다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 나머지는 프론트 화면. 없는 경로(/orders/3 등)도 index.html을 주면 React Router가 화면을 고른다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";   # 새로 배포하면 바로 새 index.html을 받게 한다
    }
}
