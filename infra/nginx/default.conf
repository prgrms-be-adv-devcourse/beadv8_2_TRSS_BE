# 외부 요청(443)을 받아 백엔드 요청은 gateway(gateway:8000)로 넘기고, 나머지는 프론트 빌드 파일로 응답한다.
# nginx는 HTTPS·프론트 화면·운영 도구(Grafana·Swagger 화면)만 맡고, 백엔드가 어떤 서비스로 나뉘는지는 모른다.
#   서비스별 경로 나누기와 JWT 검사는 gateway가 한다(gateway/src/main/resources/application.yaml).
#   새 API 경로를 만들면 여기가 아니라 gateway 경로 규칙에 추가한다.
# HTTPS(palette-shop.duckdns.org, Let's Encrypt 인증서)는 세 번에 나눠 붙인다.
#   nginx는 설정에 적힌 인증서 파일이 없으면 아예 뜨지 않으므로, 인증서를 먼저 받고 443을 연다.
#   1) 80에서 발급 확인용 경로(/.well-known/acme-challenge/)를 열어 둔다 → 서버에서 certbot으로 인증서 발급
#   2) 발급된 인증서로 443(ssl)을 연다
#   3) 지금: 80은 443으로 넘기고(발급 확인 경로만 예외), 쿠키 Secure·CORS 등을 https로 바꾼다(.env)
# 인증서 갱신은 서버 cron이 scripts/renew-cert.sh로 한다(갱신 후 nginx가 새 인증서를 다시 읽음).

# WebSocket 요청(Upgrade 헤더가 있음)이면 Connection: upgrade, 일반 요청이면 close로 넘긴다
# conf.d에 들어가는 파일이라 이 자리가 http 블록 안이다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80(http): 인증서 발급·갱신 확인 경로만 http로 답하고, 나머지는 같은 주소의 https로 넘긴다.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Let's Encrypt가 도메인 주인인지 확인하려고 http로 가져가는 파일. certbot이 이 폴더에 써 둔다.
    # 발급할 때와 90일마다 갱신할 때 모두 http로 오므로 넘기지 않는다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;                    # https에서만 쓰인다. 한 연결로 여러 요청을 동시에 보내 화면 파일을 빨리 받는다
    server_name _;

    # Let's Encrypt 인증서. certbot이 서버의 /etc/letsencrypt에 저장한다(compose.prod.yaml 볼륨).
    # live/ 아래 파일은 갱신될 때마다 최신 인증서를 가리키므로 경로는 바꾸지 않는다
    ssl_certificate     /etc/letsencrypt/live/palette-shop.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/palette-shop.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;              # 보안이 약한 예전 방식(TLS 1.0·1.1)은 받지 않는다
    ssl_session_cache shared:SSL:10m;           # 다시 접속한 브라우저는 암호화 연결 준비를 줄여 빨리 연결한다
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;           # 응답 헤더에 nginx 버전을 노출하지 않는다

    # HSTS: 이 사이트는 앞으로 https로만 접속하라고 브라우저에 알린다(http로 치면 브라우저가 알아서 https로 바꾼다).
    # 처음에는 5분만 기억하게 한다. 문제없으면 1년(31536000)으로 늘린다.
    # add_header는 location에 add_header가 하나라도 있으면 물려받지 않으므로 /assets/·/ 에도 같은 줄을 적는다.
    add_header Strict-Transport-Security "max-age=300" always;

    client_max_body_size 60m;    # 요청 본문 최대 크기. 상품 이미지 대표 1장 + 상세 10장 (spring.servlet.multipart.max-request-size와 같게)

    # 앱으로 넘길 때 붙이는 헤더. 아래 proxy_pass 하는 location들이 함께 쓴다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;      # 토스 응답 대기(30초)보다 길게
    # gateway와 HTTP/1.1로 통신한다. 기본(1.0)이면 알림 실시간 구독(SSE)처럼 응답을 흘려보내는 요청이 제대로 이어지지 않는다.
    # 구독 응답의 버퍼링은 gateway가 붙이는 X-Accel-Buffering: no 헤더로 그 응답만 끈다(gateway application.yaml의 notification-subscribe)
    proxy_http_version 1.1;

    # Docker 내부 DNS. 앱·grafana 주소를 nginx 시작할 때가 아니라 요청할 때 찾는다.
    # 찾은 주소는 5초 동안 재사용한다. 배포로 앱 IP가 바뀌면 이 시간 동안만 옛 IP로 가서 502가 날 수 있어 짧게 둔다(내부 DNS라 부담이 거의 없다)
    # ipv6=off : Docker 네트워크는 IPv4만 쓰므로 IPv6(AAAA) 주소는 묻지 않는다
    resolver 127.0.0.11 valid=5s ipv6=off;

    # gateway 주소. upstream 블록 대신 변수로 두어 proxy_pass가 요청할 때 주소를 찾게 한다.
    #   - 배포로 gateway 컨테이너가 다시 만들어져 IP가 바뀌어도 reload 없이 5초 안에 새 IP로 보낸다
    #   - gateway가 없어도 nginx는 뜨고, 백엔드 경로만 502가 난다(upstream이면 nginx 전체가 시작하지 못한다)
    # 주소 뒤에 경로를 붙이지 않는다. 붙이면 요청 경로가 바뀌어 넘어간다
    set $gateway http://gateway:8000;

    # 프론트 빌드 결과(dist). compose.prod.yaml에서 서버의 ~/palette-web을 연결한다.
    root /usr/share/nginx/html;
    index index.html;

    # Delivery Tracker가 배송 상태가 바뀔 때 부르는 웹훅(gateway → delivery-service). 주소 끝이 비밀 토큰이다.
    # access_log off : 접근 로그(→ Loki)에 토큰이 든 주소가 남지 않게 한다. gateway(ServiceConnectionFailureFilter)·앱도 이 경로는 토큰을 로그에 찍지 않는다.
    # ^~ : 아래 정규식 location보다 먼저 고른다. 없으면 맨 아래 프론트 화면(location /)이 받아 index.html을 준다.
    location ^~ /webhooks/delivery-tracker/ {
        access_log off;
        proxy_pass $gateway;
    }

    # Swagger 화면(swagger 컨테이너). /swagger-ui를 떼지 않고 넘긴다(compose.prod.yaml의 BASE_URL)
    # ^~ : 아래 정규식 location(/api/·/v3/api-docs)보다 먼저 고른다
    # 끝에 /가 없으면 여기서 붙인다. 컨테이너에 맡기면 자기 포트(:8080)를 붙인 주소로 보내 화면이 안 열린다
    location = /swagger-ui { return 301 /swagger-ui/; }
    location ^~ /swagger-ui/ {
        set $swagger http://swagger:8080;
        proxy_pass $swagger;
    }

    # 백엔드 API와 서비스별 Swagger 문서(/v3/api-docs/{서비스}, Swagger 화면의 서비스 선택 드롭다운이 읽음)는 gateway로 넘긴다.
    # 서비스 간 호출(/internal/**)은 Docker 내부망으로 직접 부르므로 여기서 열지 않는다(gateway도 규칙이 없어 404)
    # /v3/api-docs(서비스 이름 없이)는 scripts/deploy.sh의 nginx 확인이 쓴다(gateway가 payment로 넘긴다)
    location ~ ^/(api/|v3/api-docs) {
        proxy_pass $gateway;
    }

    # actuator(메트릭·상태)는 밖으로 내보내지 않는다. 앱은 컨테이너 안 관리 포트(9091)에만 띄우고 Alloy가 내부망으로 읽는다.
    # ^~ : 맨 아래 프론트 화면(location /)이 받아 index.html(200)을 주지 않게 명시적으로 404
    location ^~ /actuator {
        return 404;
    }

    # 로그 모니터링 화면(Grafana). /grafana를 떼지 않고 그대로 넘긴다(GF_SERVER_SERVE_FROM_SUB_PATH=true).
    # ^~ : 이 경로는 위의 정규식 location보다 먼저 고른다
    # 실시간 기능(/grafana/api/live/)의 WebSocket도 여기서 함께 받는다.
    # location 안에서 proxy_set_header를 하나라도 정하면 server의 공통 헤더를 물려받지 않으므로 전부 다시 적는다.
    location ^~ /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
    }

    # /images: 프론트 파일(로고·배너 등)이 있으면 그 파일을, 없으면 market이 저장한 상품 이미지를 준다(gateway → market)
    location /images/ {
        try_files $uri @gateway;
    }

    location @gateway {
        proxy_pass $gateway;
    }

    # 빌드 파일은 이름에 내용 해시가 붙어서 오래 캐시해도 된다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=300" always;
    }

    # 나머지는 프론트 화면. 없는 경로(/orders/3 등)도 index.html을 주면 React Router가 화면을 고른다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";   # 새로 배포하면 바로 새 index.html을 받게 한다
        add_header Strict-Transport-Security "max-age=300" always;
    }
}
