# 외부 요청(80)을 받아 백엔드 경로는 Spring 앱으로 넘기고, 나머지는 프론트 빌드 파일로 응답한다.
#   회원 경로 → member(member:8081), 상품·주문 경로 → market(market:8082), 결제 경로 → payment(payment:8083),
#   정산 경로 → settlement(settlement:8084), 그 밖의 백엔드 경로 → payment
# upstream과 location은 위 포트 순서대로 적는다.
# 서비스가 분리될 때마다 그 서비스 경로를 따로 빼서 넘긴다. (gateway가 생기면 이 분기는 gateway로 옮긴다)
# HTTPS는 도메인을 정한 뒤 추가한다.
upstream member {
    server member:8081;
}

upstream market {
    server market:8082;
}

upstream payment {
    server payment:8083;
}

upstream settlement {
    server settlement:8084;
}

# WebSocket 요청(Upgrade 헤더가 있음)이면 Connection: upgrade, 일반 요청이면 close로 넘긴다
# conf.d에 들어가는 파일이라 이 자리가 http 블록 안이다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;           # 응답 헤더에 nginx 버전을 노출하지 않는다
    client_max_body_size 60m;    # 요청 본문 최대 크기. 상품 이미지 대표 1장 + 상세 10장 (spring.servlet.multipart.max-request-size와 같게)

    # 앱으로 넘길 때 붙이는 헤더. 아래 proxy_pass 하는 location들이 함께 쓴다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;      # 토스 응답 대기(30초)보다 길게

    # Docker 내부 DNS. grafana 주소를 nginx 시작할 때가 아니라 요청할 때 찾게 한다
    resolver 127.0.0.11 valid=10s;

    # 프론트 빌드 결과(dist). compose.prod.yaml에서 서버의 ~/palette-web을 연결한다.
    root /usr/share/nginx/html;
    index index.html;

    # 서비스별 경로는 포트 순서(member 8081 → market 8082 → payment 8083 → settlement 8084)로 적는다
    # 정규식 location은 위에서부터 고르므로 아래의 /api/ 전체 규칙보다 먼저 둔다
    # (seller/·admin/ 아래는 서비스마다 나뉘어 있어 경로를 하나씩 적는다)

    # 내 쿠폰 사용 내역은 users/ 아래지만 쿠폰 데이터가 market에 있다
    # 바로 아래 member 규칙(users)에 먼저 걸리지 않도록 member 규칙보다 위에 따로 둔다
    location ~ ^/api/v1/users/me/coupon-usages(/|$) {
        proxy_pass http://market;
    }

    # member-service 경로: 인증·회원·판매자 (판매자 본인 정보, 관리자 회원·판매자 관리 포함)
    # seller/ 아래 상품·주문 항목(market)과 정산(settlement)은 각자의 규칙에서 고른다
    location ~ ^/api/v1/(auth|users|sellers|seller/me|admin/users|admin/sellers)(/|$) {
        proxy_pass http://member;
    }

    # market-service 경로: 상품·카테고리·장바구니·주문·찜·리뷰·쿠폰 (판매자·관리자용 포함)
    location ~ ^/api/v1/(products|categories|cart|orders|wishlist|reviews|coupons|seller/products|seller/order-items|admin/products|admin/categories|admin/product-stop-requests|admin/coupons)(/|$) {
        proxy_pass http://market;
    }

    # payment-service 경로: 예치금 지갑·충전, 관리자 결제·충전 조회
    location ~ ^/api/v1/(wallet|topups|admin/payments|admin/topups)(/|$) {
        proxy_pass http://payment;
    }

    # settlement-service 경로: 관리자 정산·정산 후보, 판매자 정산 조회
    # 서비스 간 호출(/internal/**)은 Docker 내부망으로 직접 부르므로 여기서 열지 않는다
    location ~ ^/api/v1/(admin/settlements|admin/settlement-candidates|seller/settlements)(/|$) {
        proxy_pass http://settlement;
    }

    # 그 밖의 백엔드 경로와 Swagger는 payment로 넘긴다 (루트 모놀리스가 없어져 기본 대상을 payment로 바꿨다)
    # Swagger는 payment 것만 열린다
    location ~ ^/(api/|v3/api-docs|swagger-ui) {
        proxy_pass http://payment;
    }

    # 로그 모니터링 화면(Grafana). /grafana를 떼지 않고 그대로 넘긴다(GF_SERVER_SERVE_FROM_SUB_PATH=true).
    # ^~ : 이 경로는 위의 정규식 location보다 먼저 고른다
    # 실시간 기능(/grafana/api/live/)의 WebSocket도 여기서 함께 받는다.
    # location 안에서 proxy_set_header를 하나라도 정하면 server의 공통 헤더를 물려받지 않으므로 전부 다시 적는다.
    location ^~ /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
    }

    # /images: 프론트 파일(로고·배너 등)이 있으면 그 파일을, 없으면 market이 저장한 상품 이미지를 준다
    location /images/ {
        try_files $uri @market;
    }

    location @market {
        proxy_pass http://market;
    }

    # 빌드 파일은 이름에 내용 해시가 붙어서 오래 캐시해도 된다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 나머지는 프론트 화면. 없는 경로(/orders/3 등)도 index.html을 주면 React Router가 화면을 고른다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";   # 새로 배포하면 바로 새 index.html을 받게 한다
    }
}
