# 앱 ERROR 로그 알림 규칙. 1분마다 최근 5분의 ERROR 로그 수를 세고, 1건이라도 있으면 알린다.
# 대상은 앱 컨테이너 전부(palette-*)에서 인프라 컨테이너(nginx·postgres·redis·kafka·elasticsearch·모니터링)를 뺀 것이다(세 쿼리 모두).
#   서비스가 분리되어 앱이 늘면 따로 고치지 않아도 자동으로 들어간다. 인프라 컨테이너가 늘면 제외 목록에 추가한다.
# 앱 로그는 운영에서 JSON(ECS)으로 찍히므로(compose.prod.yaml의 LOGGING_STRUCTURED_FORMAT_CONSOLE)
# | json 으로 필요한 필드만 라벨로 꺼낸다.
#   log_level·log_logger      : 로그 레벨·로그를 남긴 클래스
#   error_type                : 맨 위 예외 (예: CannotCreateTransactionException)
#   root_cause                : 스택트레이스의 마지막 "Caused by:" 예외 (예: UnknownHostException). 없으면 error_type
#   http_path                 : "Unhandled GET /api/v1/..." 메시지의 요청 경로. 숫자 ID는 {id}로 바꿔 경로마다 알림이 쪼개지지 않게 한다
#   service_version           : 배포 커밋 SHA (deploy.sh가 APP_VERSION으로 넘기고 Dockerfile이 이미지에 넣는다)
# 원인(root_cause)·배포 버전이 다르면 다른 알림이 된다. 메시지 전문은 ID 등이 섞여 알림이 폭증하므로 라벨로 쓰지 않는다.
# 4xx는 GlobalExceptionHandler가 ERROR로 남기지 않으므로 알림 대상이 아니다.
# 클라이언트가 응답을 받기 전에 연결을 끊은 경우(AsyncRequestNotUsableException, Broken pipe)는 대응할 것이 없어 뺀다.
#
# A(최근 5분)가 알림 조건이고, D(최근 1시간)·F(최근 24시간)는 Slack 메시지에 누적 건수로만 보여 준다.
# 세 쿼리는 범위([5m]·[1h]·[24h])만 다르고 나머지는 같아야 한다. 라벨이 같아야 누적 건수가 같은 알림에 붙는다.
apiVersion: 1

groups:
  - orgId: 1
    name: palette-app
    folder: Palette
    interval: 1m
    rules:
      - uid: palette-app-error-log
        title: 앱 ERROR 로그
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: >-
                sum by (container, log_logger, error_type, root_cause, http_path, service_version) (
                  count_over_time({container=~"palette-.+", container!~"palette-(nginx|postgres|redis|kafka|elasticsearch|loki|alloy|grafana|prometheus)"}
                    |= `"level":"ERROR"` != `AsyncRequestNotUsableException`
                    | json log_level="log.level", log_logger="log.logger", error_type="error.type", stack="error.stack_trace", message="message", service_version="service.version"
                    | __error__="" | log_level="ERROR"
                    | label_format root_cause=`{{ if contains "Caused by: " .stack }}{{ regexReplaceAll "(?s).*Caused by: ([A-Za-z0-9_.]+).*" .stack "${1}" }}{{ else }}{{ .error_type }}{{ end }}`
                    | label_format http_path=`{{ if hasPrefix "Unhandled " .message }}{{ regexReplaceAll "/[0-9]+" (regexReplaceAll "^Unhandled [A-Z]+ ([^ ?]+).*" .message "${1}") "/{id}" }}{{ end }}`
                  [5m])
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
          - refId: D
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              refId: D
              queryType: instant
              expr: >-
                sum by (container, log_logger, error_type, root_cause, http_path, service_version) (
                  count_over_time({container=~"palette-.+", container!~"palette-(nginx|postgres|redis|kafka|elasticsearch|loki|alloy|grafana|prometheus)"}
                    |= `"level":"ERROR"` != `AsyncRequestNotUsableException`
                    | json log_level="log.level", log_logger="log.logger", error_type="error.type", stack="error.stack_trace", message="message", service_version="service.version"
                    | __error__="" | log_level="ERROR"
                    | label_format root_cause=`{{ if contains "Caused by: " .stack }}{{ regexReplaceAll "(?s).*Caused by: ([A-Za-z0-9_.]+).*" .stack "${1}" }}{{ else }}{{ .error_type }}{{ end }}`
                    | label_format http_path=`{{ if hasPrefix "Unhandled " .message }}{{ regexReplaceAll "/[0-9]+" (regexReplaceAll "^Unhandled [A-Z]+ ([^ ?]+).*" .message "${1}") "/{id}" }}{{ end }}`
                  [1h])
                )
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              expression: D
              reducer: last
          - refId: F
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              refId: F
              queryType: instant
              expr: >-
                sum by (container, log_logger, error_type, root_cause, http_path, service_version) (
                  count_over_time({container=~"palette-.+", container!~"palette-(nginx|postgres|redis|kafka|elasticsearch|loki|alloy|grafana|prometheus)"}
                    |= `"level":"ERROR"` != `AsyncRequestNotUsableException`
                    | json log_level="log.level", log_logger="log.logger", error_type="error.type", stack="error.stack_trace", message="message", service_version="service.version"
                    | __error__="" | log_level="ERROR"
                    | label_format root_cause=`{{ if contains "Caused by: " .stack }}{{ regexReplaceAll "(?s).*Caused by: ([A-Za-z0-9_.]+).*" .stack "${1}" }}{{ else }}{{ .error_type }}{{ end }}`
                    | label_format http_path=`{{ if hasPrefix "Unhandled " .message }}{{ regexReplaceAll "/[0-9]+" (regexReplaceAll "^Unhandled [A-Z]+ ([^ ?]+).*" .message "${1}") "/{id}" }}{{ end }}`
                  [24h])
                )
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              expression: F
              reducer: last
        for: 0s
        # ERROR가 멈춰도 1시간은 발생 중으로 유지한다. 없으면 띄엄띄엄 나는 에러(예: 10분 간격)마다
        # 5분 뒤 해결됨 → 다음 에러에 새 알림이 되어, slack.yaml의 repeat_interval(1시간)이 적용되지 않고 알림이 반복된다.
        # 대신 원인을 고친 뒤에도 최대 1시간은 발생 중으로 남는다. Grafana 12.2 이상에서만 읽는다
        keepFiringFor: 1h
        noDataState: OK       # ERROR가 없으면 결과가 비어 있으므로 정상으로 본다
        execErrState: Error   # Loki 조회 자체가 실패하면 그것도 알린다
        labels:
          severity: error
        annotations:
          summary: "{{ $labels.log_logger }}에서 최근 5분간 ERROR {{ $values.B }}건 (원인 {{ $labels.root_cause }})"
          description: >-
            Grafana Explore에서 확인:
            {container="{{ $labels.container }}"} | json | log_level="ERROR" | log_logger="{{ $labels.log_logger }}"

      # gateway가 서비스에서 응답을 받지 못한 요청: 연결 실패(서비스 컨테이너 꺼짐·재시작 중, 502)·응답 시간 초과(60초, 504).
      # ServiceConnectionFailureFilter가 주소 없이 WARN으로 남긴다.
      # 위 "앱 ERROR 로그"는 ERROR만 보므로, 서비스가 죽거나 멈춰도(로그를 못 남기므로) 알림이 없었다. 이 규칙이 그 빈틈을 메운다.
      # 2분 연속(1분 검사 2번 모두) 실패가 있을 때만 알린다(for: 1m). 한 번 끊겼다 바로 붙는 일로는 울리지 않는다.
      #   대신 알림이 1분 늦고, 요청이 드문 시간(밤)엔 실패가 2분 연속 잡히지 않아 놓칠 수 있다
      # 배포로 서비스가 재시작되는 동안은 scripts/deploy.sh가 이 규칙만 Grafana 무음(silence)으로 꺼 둔다.
      #   무음이 풀린 뒤 배포 중 실패가 남아 알림이 가지 않도록 최근 1분만 센다(deploy.sh는 배포가 끝나고 2분 뒤 무음을 푼다)
      #   위 규칙의 keepFiringFor(1시간 유지)도 같은 이유로 두지 않는다
      # uid·kind는 deploy.sh·templates.yaml이 쓰므로 바꾸면 같이 바꾼다
      - uid: palette-gateway-connection-failure
        title: gateway 서비스 응답 실패
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              # route: gateway 경로 규칙 이름(application.yaml의 routes.id). 서비스 이름과 같다(market-coupon-usages 등은 앞부분이 서비스)
              expr: >-
                sum by (route) (
                  count_over_time({container="palette-gateway"}
                    | json log_level="log.level", log_logger="log.logger", message="message"
                    | __error__="" | log_logger="com.backend.gateway.ServiceConnectionFailureFilter" | log_level="WARN"
                    | line_format `{{ .message }}`
                    | regexp `route=(?P<route>[a-z-]+)`
                  [1m])
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m               # 2분 연속일 때만 알린다(위 설명)
        noDataState: OK       # 실패가 없으면 결과가 비어 있으므로 정상으로 본다
        # Loki 조회가 실패해도 직전 상태를 유지한다. 조회 실패는 위 "앱 ERROR 로그" 규칙이 이미 "검사 실패"로 알리고,
        # 여기서 Error로 두면 kind 라벨 때문에 서비스 이름이 빈 "gateway 응답 실패" 메시지가 같이 간다
        execErrState: KeepLast
        labels:
          severity: error
          kind: gateway-connection-failure   # templates.yaml이 이 값으로 응답 실패용 메시지를 고른다
        annotations:
          summary: "gateway가 {{ $labels.route }} 서비스에서 최근 1분간 {{ $values.B }}번 응답을 받지 못했습니다(연결 실패·시간 초과)"
