# 알림을 보낼 곳(Slack)과 보내는 방식. Slack 앱의 Bot 토큰으로 팀 채널에 보낸다.
# 토큰은 서버 .env의 SLACK_BOT_TOKEN에서 읽는다. 봇이 채널에 초대되어 있어야 보낼 수 있다(/invite @Palette Bot).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-palette
    receivers:
      - uid: slack-palette
        type: slack
        # 로그 알림의 해소는 "최근 5분간 ERROR가 없었다"는 뜻뿐이라 해소(RESOLVED) 메시지는 보내지 않는다
        disableResolveMessage: true
        settings:
          token: $SLACK_BOT_TOKEN
          recipient: C0C3CMPUP2B   # 팀 알림 채널 ID. 채널을 바꾸면 봇을 새 채널에 초대하고 이 값을 바꾼다
          # 메시지 형식은 templates.yaml
          title: '{{ template "palette.slack.title" . }}'
          text: '{{ template "palette.slack.text" . }}'

# 모든 알림을 Slack으로 보낸다. 앱(container)·클래스(log_logger)·원인(root_cause)·배포 버전(service_version)마다 따로 알린다.
# 원인이 같으면 요청 경로(http_path)가 달라도 한 메시지에 묶여 온다. 배포 직후 새로 생긴 에러는 배포 버전이 달라 별도 메시지로 온다.
policies:
  - orgId: 1
    receiver: slack-palette
    group_by: ["alertname", "container", "log_logger", "root_cause", "service_version"]
    group_wait: 30s        # 처음 발생하면 30초 모았다가 보낸다
    group_interval: 5m     # 같은 묶음에 새 알림이 생기면 최소 5분 간격으로 보낸다
    repeat_interval: 1h    # 계속 발생 중이면 1시간마다 다시 알린다(제목의 1시간·24시간 누적 건수로 추세를 본다)
