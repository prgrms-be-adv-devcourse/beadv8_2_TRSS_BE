# 로컬 개발용 구성.
# 레포 루트에서 실행할 때: docker compose -f infra/compose.yaml up -d
name: palette

services:
  postgres:
    image: pgvector/pgvector:pg17-trixie   # postgres 17 + pgvector 확장(AI 추천 임베딩). postgres:17과 같은 Debian trixie(glibc 2.41)라 기존 데이터·정렬 규칙이 그대로 맞는다. 기본 pg17 태그는 bookworm(glibc 2.36)이라 쓰지 않는다
    container_name: palette-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-palette}
      POSTGRES_USER: ${DB_USERNAME:-palette}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palette}
      TZ: UTC
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:-member_user}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:-market_user}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_user}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:-settlement_user}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD:-delivery_user}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_user}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai_user}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-readonly_user}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # DB가 비어 있을 때(처음 뜰 때) 서비스별 스키마·계정을 만든다
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: palette-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka
  kafka:
    image: apache/kafka:4.1.0
    container_name: palette-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 브로커 자동 생성을 끈다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # 상품 검색용 Elasticsearch (노드 1대, nori 포함)
  # 확인: curl -u elastic:elastic http://localhost:9200
  elasticsearch:
    build: ./elasticsearch
    image: palette-elasticsearch
    container_name: palette-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms768m -Xmx768m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}
      xpack.security.enabled: "true"
      # HTTPS는 끈다.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  kafka-data:
  es-data:
