# 운영 서버(EC2) 전용 구성. 로컬 개발은 compose.yaml을 쓴다.
# 실행(레포 루트에서): docker compose -f infra/compose.prod.yaml up -d --build
# 값은 같은 폴더(infra/)의 .env에서 읽는다(.env.prod.example 참고). .env는 서버에만 두고 커밋하지 않는다.
# 이 파일의 상대 경로(./nginx, ./monitoring, ..)는 이 파일이 있는 infra/ 기준이다.
# 외부에는 nginx 80번만 연다. app·postgres·redis는 Docker 내부 네트워크로만 통신한다.
name: palette

# 컨테이너 로그(docker logs) 파일 크기 제한. 없으면 서버 디스크(50GB)를 계속 차지한다.
# 오래 보관할 로그는 Loki(monitoring/loki/config.yaml, 14일)에서 본다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:stable
    container_name: palette-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트 빌드 결과(dist). 이 레포 밖(~/palette-web)에 두어 git pull과 섞이지 않게 한다.
      # 폴더가 없으면 Docker가 빈 폴더를 만들어 화면이 403이 되므로, 프론트 파일을 먼저 올린다.
      - ../../palette-web:/usr/share/nginx/html:ro
    # nginx는 시작할 때 app·market의 이름을 찾으므로 둘이 먼저 떠 있어야 한다.
    # grafana는 요청할 때 찾으므로(nginx/default.conf의 resolver) 꺼져 있어도 nginx는 뜬다.
    depends_on:
      - app
      - market

  app:
    # 이미지는 레포 루트의 Dockerfile로 빌드한다(Gradle 빌드 기준이 루트)
    build:
      context: ..
      dockerfile: Dockerfile
    image: palette-app
    container_name: palette-app
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # .env의 값보다 우선한다. 컨테이너끼리는 서비스 이름으로 찾는다.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # nginx가 넘긴 X-Forwarded-* 헤더로 원래 요청 주소·프로토콜을 판단한다.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 로그를 한 줄짜리 JSON(ECS)으로 찍는다. 스택트레이스가 한 건으로 묶여 Loki에서 레벨·클래스로 걸러진다.
      # 로컬은 이 값이 없어 지금처럼 사람이 읽는 형식으로 찍힌다.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # JVM 힙은 이 값의 75%(Dockerfile의 MaxRAMPercentage). 서버 8GB를 DB·Redis와 나눠 쓴다.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 상품·주문(market-service). 같은 Dockerfile에서 MODULE만 바꿔 빌드한다.
  # DB는 market 스키마에 market_user로 접속한다(app의 DB_USERNAME과 다른 계정).
  market:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: market-service
    image: palette-market
    container_name: palette-market
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 비어 있으면 DB_USERNAME(palette)으로 접속해 테이블 주인이 바뀌므로 반드시 넣는다
      MARKET_DB_USERNAME: ${MARKET_DB_USERNAME:?MARKET_DB_USERNAME이 .env에 없습니다}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # 서버 8GB를 app(2g)·Kafka(1g)·DB·모니터링과 나눠 쓴다
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: palette-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME이 .env에 없습니다}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME이 .env에 없습니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 .env에 없습니다}
      TZ: UTC   # 로컬 compose.yaml과 같게 둔다. 앱은 JVM 시간대(KST)로 LocalDateTime을 저장한다.
      # 서비스별 DB 계정 비밀번호(postgres/init/01-init-schemas.sh가 계정을 만들 때 쓴다)
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?MEMBER_DB_PASSWORD가 .env에 없습니다}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:?MARKET_DB_PASSWORD가 .env에 없습니다}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD가 .env에 없습니다}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?SETTLEMENT_DB_PASSWORD가 .env에 없습니다}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD가 .env에 없습니다}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?READONLY_DB_PASSWORD가 .env에 없습니다}
    # 서버 안(127.0.0.1)에서만 접속된다. 외부에서 보려면 SSH 터널을 쓴다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # DB가 비어 있을 때만 자동 실행된다. 이미 데이터가 있는 운영 DB에는 스크립트 안내대로 한 번 직접 실행한다
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: palette-redis
    restart: unless-stopped
    logging: *default-logging
    # 재시작해도 Refresh Token·인증코드가 사라지지 않게 디스크에 남긴다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Outbox 릴레이가 이벤트를 발행하는 Kafka
  # app만 Docker 내부 네트워크(kafka:9092)로 접속한다. 외부·호스트에는 열지 않는다.
  kafka:
    image: apache/kafka:4.1.0
    container_name: palette-kafka
    restart: unless-stopped
    logging: *default-logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 1대라 내부 토픽 복제 수도 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 릴레이가 처음 보낼 때 만든다(OutboxKafkaSender). 오타로 엉뚱한 토픽이 생기지 않게 브로커 자동 생성은 끈다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 이벤트 원본은 outbox_event에 남으므로 Kafka에는 3일·파티션당 512MB까지만 둔다(디스크 50GB)
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 힙 512MB + 페이지 캐시·메타스페이스. 서버 8GB 안에서 app(2g)·DB·모니터링과 나눠 쓴다
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── 로그 모니터링: Alloy(수집) → Loki(저장) → Grafana(조회·Slack 알림) ──
  # Grafana는 nginx를 거쳐 http://{EC2_HOST}/grafana/ 로 연다(nginx/default.conf). 3000번은 외부에 열지 않는다.
  # nginx가 안 될 때는 SSH 터널로도 볼 수 있다.
  #   ssh -L 3000:localhost:3000 {EC2_USER}@{EC2_HOST} 후 http://localhost:3000/grafana/
  loki:
    image: grafana/loki:3.5.0
    container_name: palette-loki
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: palette-alloy
    restart: unless-stopped
    logging: *default-logging
    # storage.path: 어디까지 보냈는지 기억해, 재시작해도 로그를 중복으로 보내지 않는다
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    container_name: palette-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 .env에 없습니다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 브라우저로 여는 주소. Slack 알림의 "Grafana에서 로그 보기" 링크도 이 주소로 만들어진다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL이 .env에 없습니다}
      # ROOT_URL의 경로(/grafana/) 아래에서 동작한다. nginx는 /grafana를 떼지 않고 그대로 넘긴다.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # monitoring/grafana/provisioning/alerting/slack.yaml이 읽는다
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN이 .env에 없습니다}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - loki

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  loki-data:
  alloy-data:
  grafana-data:
