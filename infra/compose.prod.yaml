# 운영 서버(EC2) 전용 구성. 로컬 개발은 compose.yaml을 쓴다.
# 실행(레포 루트에서): docker compose -f infra/compose.prod.yaml up -d --build
# 값은 같은 폴더(infra/)의 .env에서 읽는다(.env.prod.example 참고). .env는 서버에만 두고 커밋하지 않는다.
# 이 파일의 상대 경로(./nginx, ./monitoring, ..)는 이 파일이 있는 infra/ 기준이다.
# 외부에는 nginx 80번만 연다. app·postgres·redis는 Docker 내부 네트워크로만 통신한다.
name: palette

# 컨테이너 로그(docker logs) 파일 크기 제한. 없으면 서버 디스크(50GB)를 계속 차지한다.
# 오래 보관할 로그는 Loki(monitoring/loki/config.yaml, 14일)에서 본다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Spring 앱(payment·member·market·settlement) 기동 확인. scripts/deploy.sh는 이 상태(healthy)를 보고 배포 성공을 판단한다.
# 앱마다 컨테이너 안에서 로그인 없이 열리는 Swagger 문서(/v3/api-docs)가 200인지 본다.
#   정산처럼 로그인 없이 열리는 API가 없는 앱도 같은 방식으로 확인하려고 nginx를 거치지 않는다.
# 실행 이미지에 curl이 없어도 되게 bash로 HTTP 요청을 직접 보낸다. 포트만 앱마다 다르다(각 서비스의 test).
#   첫 줄(상태)만 읽고 끊으면 앱이 본문을 보내다 Broken pipe ERROR를 남기므로, 본문까지 끝까지 읽고 판단한다.
#   $$는 compose가 $를 변수로 바꾸지 않게 하는 표기다(bash에는 $로 전달된다).
x-app-healthcheck: &app-healthcheck
  interval: 10s
  # 막 뜬 앱은 첫 /v3/api-docs 생성(전체 API 스캔)에 5초 넘게 걸릴 수 있다.
  # 시간이 다 되면 Docker가 요청을 끊어 앱에 Broken pipe가 나므로 넉넉히 기다린다(평소 응답은 1초 미만)
  timeout: 15s
  retries: 3
  start_period: 90s   # 앱이 뜨는 동안 실패해도 unhealthy로 세지 않는다

services:
  nginx:
    image: nginx:stable
    container_name: palette-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 프론트 빌드 결과(dist). 이 레포 밖(~/palette-web)에 두어 git pull과 섞이지 않게 한다.
      # 폴더가 없으면 Docker가 빈 폴더를 만들어 화면이 403이 되므로, 프론트 파일을 먼저 올린다.
      - ../../palette-web:/usr/share/nginx/html:ro
    # nginx는 시작할 때 member·market·payment·settlement의 이름을 찾으므로 먼저 떠 있어야 한다.
    # grafana는 요청할 때 찾으므로(nginx/default.conf의 resolver) 꺼져 있어도 nginx는 뜬다.
    depends_on:
      - member
      - market
      - payment
      - settlement

  # 회원·인증·판매자(member-service). 같은 Dockerfile에서 MODULE만 바꿔 빌드한다.
  # DB는 member 스키마에 member_user로 접속한다(DB_USERNAME과 다른 계정).
  # 처음 띄우기 전에 운영 DB의 회원 테이블을 public에서 member로 옮겨야 한다(member-service V1 파일 주석 참고).
  #   옮기기 전에 뜨면 빈 member 스키마에 V1으로 빈 테이블을 만들어 버린다.
  member:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: member-service
    image: palette-member
    container_name: palette-member
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # 이메일 인증코드·로그인 실패 횟수·Refresh Token을 Redis에 둔다
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 비어 있으면 DB_USERNAME(palette)으로 접속해 테이블 주인이 바뀌므로 반드시 넣는다
      MEMBER_DB_USERNAME: ${MEMBER_DB_USERNAME:?MEMBER_DB_USERNAME이 .env에 없습니다}
      # 회원이 부르는 다른 서비스 내부 API 주소. Docker 내부망으로 직접 부른다
      # 주문 내부 API(/internal/v1/orders): 탈퇴 검사, 판매자 철회 승인, 관리자 회원 상세
      MARKET_SERVICE_URL: http://market:8082
      # 정산 내부 API(/internal/v1/settlements): 판매자 철회 요청·승인, 판매자 회원 탈퇴의 미지급 금액 확인
      SETTLEMENT_SERVICE_URL: http://settlement:8084
      # 결제 내부 API(/internal/v1/payments): 탈퇴 검사, 관리자 회원 상세
      PAYMENT_SERVICE_URL: http://payment:8083
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # market·settlement와 같은 1g(힙 768MB)
    mem_limit: 1g
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /v3/api-docs HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && cat <&3 >/dev/null && [[ $$status =~ ^HTTP/[0-9.]+\\ 200 ]]"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 상품·주문(market-service). 같은 Dockerfile에서 MODULE만 바꿔 빌드한다.
  # DB는 market 스키마에 market_user로 접속한다(DB_USERNAME과 다른 계정).
  market:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: market-service
    image: palette-market
    container_name: palette-market
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 비어 있으면 DB_USERNAME(palette)으로 접속해 테이블 주인이 바뀌므로 반드시 넣는다
      MARKET_DB_USERNAME: ${MARKET_DB_USERNAME:?MARKET_DB_USERNAME이 .env에 없습니다}
      # 회원 내부 API(/internal/v1/members·sellers)를 부르는 member-service 주소
      # Docker 내부망으로 직접 부르고 nginx를 거치지 않는다. 키(INTERNAL_API_KEY)는 .env에서 읽는다
      MEMBER_SERVICE_URL: http://member:8081
      # 결제 내부 API(/internal/v1/payments)를 부르는 payment-service 주소 (주문 결제·취소, 결제 시도 조회)
      # 지금은 결제 클라이언트가 임시 구현이라 읽지 않는다. HTTP로 바꿀 때 이 이름으로 읽는다
      PAYMENT_SERVICE_URL: http://payment:8083
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_VERSION: ${APP_VERSION:-unknown}
    # 서버 8GB를 다른 앱(각 1g)·Kafka(1g)·DB·모니터링과 나눠 쓴다
    mem_limit: 1g
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /v3/api-docs HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && cat <&3 >/dev/null && [[ $$status =~ ^HTTP/[0-9.]+\\ 200 ]]"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 예치금·충전·결제·정산 지급(payment-service). 같은 Dockerfile에서 MODULE만 바꿔 빌드한다.
  # 루트 모놀리스(app)가 하던 마지막 기능이라, 결제가 분리되면서 app 컨테이너를 이 서비스로 바꿨다.
  # DB는 payment 스키마에 payment_user로 접속한다(DB_USERNAME과 다른 계정).
  # 처음 띄우기 전에 운영 DB의 결제 테이블을 public에서 payment로 옮겨야 한다(payment-service V1 파일 주석 참고).
  #   옮기기 전에 뜨면 빈 payment 스키마에 V1으로 빈 테이블을 만들어 버린다.
  payment:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: payment-service
    image: palette-payment
    container_name: palette-payment
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      # .env의 값보다 우선한다. 컨테이너끼리는 서비스 이름으로 찾는다.
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 비어 있으면 기본값(로컬 계정)으로 접속하므로 반드시 넣는다
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:?PAYMENT_DB_USERNAME이 .env에 없습니다}
      # 결제가 회원 내부 API(/internal/v1/members)를 부를 member-service 주소 (충전 전 회원 확인, 관리자 결제·충전 조회의 이메일)
      MEMBER_SERVICE_URL: http://member:8081
      # nginx가 넘긴 X-Forwarded-* 헤더로 원래 요청 주소·프로토콜을 판단한다.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 로그를 한 줄짜리 JSON(ECS)으로 찍는다. 스택트레이스가 한 건으로 묶여 Loki에서 레벨·클래스로 걸러진다.
      # 로컬은 이 값이 없어 지금처럼 사람이 읽는 형식으로 찍힌다.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # 로그의 service.version에 배포 커밋 SHA를 넣는다(deploy.sh가 APP_VERSION을 넘김). Slack 에러 알림이 배포 커밋 링크로 쓴다
      LOGGING_STRUCTURED_ECS_SERVICE_VERSION: ${APP_VERSION:-unknown}
    # JVM 힙은 이 값의 75%(Dockerfile의 MaxRAMPercentage). member·market·settlement와 같은 1g(힙 768MB)
    mem_limit: 1g
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /v3/api-docs HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && cat <&3 >/dev/null && [[ $$status =~ ^HTTP/[0-9.]+\\ 200 ]]"]
    # 결제는 Redis를 쓰지 않는다
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 정산(settlement-service). 같은 Dockerfile에서 MODULE만 바꿔 빌드한다.
  # DB는 settlement 스키마에 settlement_user로 접속한다(DB_USERNAME과 다른 계정).
  # 처음 띄우기 전에 운영 DB의 정산 테이블을 public에서 settlement로 옮겨야 한다(settlement-service V1 파일 주석 참고).
  #   옮기기 전에 뜨면 빈 settlement 스키마에 V1으로 빈 테이블을 만들어 버린다.
  # 결제·회원 서비스 연결 전이라 스케줄러(월 정산·지급 재시도)는 끈 채로 둔다(SETTLEMENT_SCHEDULING_ENABLED 기본 false).
  settlement:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: settlement-service
    image: palette-settlement
    container_name: palette-settlement
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 비어 있으면 DB_USERNAME(palette)으로 접속해 테이블 주인이 바뀌므로 반드시 넣는다
      SETTLEMENT_DB_USERNAME: ${SETTLEMENT_DB_USERNAME:?SETTLEMENT_DB_USERNAME이 .env에 없습니다}
      # 결제 내부 API(/internal/v1/payments)를 부르는 payment-service 주소 (정산금 지급, 지급 결과 조회)
      # 지금은 결제 클라이언트가 임시 구현이라 읽지 않는다. HTTP로 바꿀 때 이 이름으로 읽는다
      PAYMENT_SERVICE_URL: http://payment:8083
      SERVER_FORWARD_HEADERS_STRATEGY: native
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_VERSION: ${APP_VERSION:-unknown}
    # market과 같은 1g(힙 768MB). 월 1회 배치와 관리자 조회뿐이라 평소 사용량은 market(약 430MB)과 비슷하다
    mem_limit: 1g
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /v3/api-docs HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r status <&3 && cat <&3 >/dev/null && [[ $$status =~ ^HTTP/[0-9.]+\\ 200 ]]"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: palette-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME이 .env에 없습니다}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME이 .env에 없습니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 .env에 없습니다}
      TZ: UTC   # 로컬 compose.yaml과 같게 둔다. 앱은 JVM 시간대(KST)로 LocalDateTime을 저장한다.
      # 서비스별 DB 계정 비밀번호(postgres/init/01-init-schemas.sh가 계정을 만들 때 쓴다)
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:?MEMBER_DB_PASSWORD가 .env에 없습니다}
      MARKET_DB_PASSWORD: ${MARKET_DB_PASSWORD:?MARKET_DB_PASSWORD가 .env에 없습니다}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD가 .env에 없습니다}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?SETTLEMENT_DB_PASSWORD가 .env에 없습니다}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD가 .env에 없습니다}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:?READONLY_DB_PASSWORD가 .env에 없습니다}
    # 서버 안(127.0.0.1)에서만 접속된다. 외부에서 보려면 SSH 터널을 쓴다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # DB가 비어 있을 때만 자동 실행된다. 이미 데이터가 있는 운영 DB에는 스크립트 안내대로 한 번 직접 실행한다
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: palette-redis
    restart: unless-stopped
    logging: *default-logging
    # 재시작해도 Refresh Token·인증코드가 사라지지 않게 디스크에 남긴다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Outbox 릴레이가 이벤트를 발행하는 Kafka
  # app만 Docker 내부 네트워크(kafka:9092)로 접속한다. 외부·호스트에는 열지 않는다.
  kafka:
    image: apache/kafka:4.1.0
    container_name: palette-kafka
    restart: unless-stopped
    logging: *default-logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 1대라 내부 토픽 복제 수도 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 릴레이가 처음 보낼 때 만든다(OutboxKafkaSender). 오타로 엉뚱한 토픽이 생기지 않게 브로커 자동 생성은 끈다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 이벤트 원본은 outbox_event에 남으므로 Kafka에는 3일·파티션당 512MB까지만 둔다(디스크 50GB)
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    # 힙 512MB + 페이지 캐시·메타스페이스. 서버 8GB 안에서 앱(각 1g)·DB·모니터링과 나눠 쓴다
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── 로그 모니터링: Alloy(수집) → Loki(저장) → Grafana(조회·Slack 알림) ──
  # Grafana는 nginx를 거쳐 http://{EC2_HOST}/grafana/ 로 연다(nginx/default.conf). 3000번은 외부에 열지 않는다.
  # nginx가 안 될 때는 SSH 터널로도 볼 수 있다.
  #   ssh -L 3000:localhost:3000 {EC2_USER}@{EC2_HOST} 후 http://localhost:3000/grafana/
  loki:
    image: grafana/loki:3.5.0
    container_name: palette-loki
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: palette-alloy
    restart: unless-stopped
    logging: *default-logging
    # storage.path: 어디까지 보냈는지 기억해, 재시작해도 로그를 중복으로 보내지 않는다
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      - loki

  grafana:
    # 12.2부터 알림 규칙 파일의 keepFiringFor(해결 판단 유예)를 읽는다(monitoring/grafana/provisioning/alerting/rules.yaml)
    image: grafana/grafana:12.2.0
    container_name: palette-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 .env에 없습니다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 브라우저로 여는 주소. Slack 알림의 "Grafana에서 로그 보기" 링크도 이 주소로 만들어진다.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL이 .env에 없습니다}
      # ROOT_URL의 경로(/grafana/) 아래에서 동작한다. nginx는 /grafana를 떼지 않고 그대로 넘긴다.
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # monitoring/grafana/provisioning/alerting/slack.yaml이 읽는다
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN이 .env에 없습니다}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - loki

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  loki-data:
  alloy-data:
  grafana-data:
