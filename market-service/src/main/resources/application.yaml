server:
  port: ${MARKET_PORT:8082}   # 로컬에서 루트 모놀리스(8080)와 같이 띄울 수 있게 다른 포트를 쓴다

spring:
  application:
    name: market-service

  # 프로젝트 루트의 .env를 읽음 (없으면 무시). bootRun은 모듈 폴더에서 실행되므로 상위 폴더도 찾는다
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # market 스키마만 쓴다. 운영에서는 market_user(자기 스키마 권한만 가진 계정)로 접속한다
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palette}?currentSchema=market
    username: ${MARKET_DB_USERNAME:${DB_USERNAME:market_user}}
    password: ${MARKET_DB_PASSWORD:${DB_PASSWORD:market_user}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 바꾸고, 엔티티와 다르면 앱 시작을 막는다.

  flyway:
    schemas: market
    default-schema: market
    # 운영 DB: 테이블을 public에서 market으로 옮긴 뒤 처음 뜰 때 V1(baseline)은 이미 적용된 것으로 기록하고 V2부터 실행한다
    # 빈 DB(로컬·CI·새 서버): V1부터 실행한다
    baseline-on-migrate: true
    baseline-version: 1

  # 상품 이미지 업로드 크기. 대표 1장 + 상세 10장을 한 요청으로 받는다 (nginx client_max_body_size도 같이 맞춘다)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 60MB

  data:
    # 인기 검색어. 검색 요청 안에서 부르므로 제한 시간을 짧게 두고, 실패해도 검색은 그대로 응답한다
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      repositories:
        enabled: false   # Redis 리포지토리를 쓰지 않는다 (JPA 리포지토리를 Redis용으로도 스캔하지 않게)
    # ES는 리포지토리 없이 ElasticsearchClient로 직접 다룬다 (JPA 리포지토리와 섞이지 않게 스캔도 끈다)
    elasticsearch:
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Outbox 릴레이가 이벤트 봉투를 발행하는 Kafka. 컨슈머는 seller.events(판매자 이벤트)와 delivery.events(배송 완료)를 받는다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                   # 브로커가 기록을 마친 뒤에 성공으로 본다(그때 outbox를 PUBLISHED로 바꿈)
      properties:
        enable.idempotence: true  # 프로듀서 재시도로 같은 메시지가 두 번 기록되지 않게
        max.block.ms: 5000        # 브로커가 없을 때 send가 오래 막히지 않게(기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record            # 메시지 하나를 처리(커밋)한 뒤에 offset을 커밋한다

  # 상품 검색 Elasticsearch (custom.product.search.engine=es일 때만 쓴다). 로컬은 기본값, 개발 서버는 서버 .env 값으로 접속한다
  # 앱이 뜰 때는 접속하지 않으므로 ES가 꺼져 있어도 market은 뜨고, 검색은 DB 검색으로 대신한다
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${SPRING_ELASTICSEARCH_USERNAME:elastic}
    password: ${SPRING_ELASTICSEARCH_PASSWORD:elastic}
    connection-timeout: 1s   # 검색 요청 안에서 부르므로 짧게 두고, 실패하면 DB 검색으로 대신한다
    socket-timeout: 3s

  task:
    scheduling:
      pool:
        size: 9          # 스케줄 작업(주문 4, outbox 릴레이 1, 할인 경계 1, 검색 alias 복구 1, 상호명 채우기 1, 판매 지표 1)이 서로 기다리지 않게 작업 수만큼


# 정책 값. 코드에 숫자를 직접 쓰지 않고 각 컨텍스트의 <Ctx>Policy에서 읽는다.
custom:
  jwt:
    # 서명 키: 모든 서비스가 같은 값을 쓴다. 기본값 없이 환경변수(.env)로만 주입한다.
    secret: ${JWT_SECRET}
    accessTokenExpireMinutes: 30          # Access Token 유효 시간(분)
  internal:
    # 서비스 간 호출(/internal/**) 인증 키. X-Internal-Key 헤더로 보낸다. 모든 서비스가 같은 값을 쓰고, 기본값 없이 환경변수(.env)로만 주입한다.
    # market이 받는 내부 API(/internal/v1/orders) 검사와 회원·결제·배송 내부 API 호출(MemberApiClient, PaymentApiClient, DeliveryApiClient)에 함께 쓴다
    apiKey: ${INTERNAL_API_KEY}
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}   # 프론트 주소(쉼표로 구분)
  product:
    search:
      engine: ${PRODUCT_SEARCH_ENGINE:es}   # 구매자 상품 검색 구현: es(Elasticsearch, ES 장애 때는 DB 검색으로 대신) | jpa(DB LIKE 검색, 테스트)
      indexAlias: products                  # 검색·색인에 쓰는 alias. 실제 인덱스는 products_{만든 시각}이다 (market_es_user는 products로 시작하는 인덱스만 다룬다)
      indexBatchSize: 500                   # 전체 재색인이 한 번에 읽어 bulk로 보내는 상품 수
      discountBoundaryIntervalSeconds: 10   # 할인 경계 재색인 스케줄러 실행 간격(초). 할인이 시작·종료된 뒤 가격순에 반영되기까지 최대 이만큼 늦어진다
      discountBoundaryOverlapSeconds: 30    # 전체 재색인 보정이 재색인 시작 시각보다 이만큼 앞부터 바뀐 상품을 다시 본다(커밋 지연). 할인 경계 스케줄러는 겹쳐 읽지 않는다
      discountBoundaryLookbackMinutes: 5    # 앱을 띄운 뒤 첫 실행(지난 실행 시각이 없을 때)만 이만큼 돌아본다. 재시작·배포 동안 지난 경계를 채운다
      skipAfterFailureSeconds: 30           # ES 검색(검색·비슷한 상품·추천)이 접속·응답에 실패하면 이만큼(초) ES를 부르지 않고 DB로 대신한다. 장애 동안 요청마다 응답 제한 시간만큼 기다리지 않게 한다
      businessNameFillIntervalSeconds: 300  # 회원 서비스가 실패해 상호명 없이 색인된 상품을 찾아 상호명을 채우는 간격(초)
      aliasCheckIntervalSeconds: 60         # 검색 alias가 있는지 확인하는 간격(초). 없으면 전체 재색인한다(기동 직후 첫 확인). ES 장애·데이터 재구성 뒤 이 시간 안에 복구된다
      indexConsumer:                        # 검색 색인 컨슈머(product.events, groupId market-search-index). 일시 오류(ES·DB 연결)는 DLT 없이 성공할 때까지 다시 처리한다
        retryInitialIntervalMillis: 1000    # 첫 재시도 전 대기(밀리초). 이후 두 배씩 늘린다
        retryMaxIntervalMillis: 30000       # 재시도 간격 최대(밀리초). ES가 돌아온 뒤 이 시간 안에 밀린 변경 반영을 다시 시작한다
    behavior:              # 행동 점수 = wishWeight·찜 + ratingWeight·별점 + salesWeight·판매 (각 0~1). 인기순 정렬과 추천의 행동 점수에 쓴다
      wishWeight: 0.4      # 가중치 합은 1이어야 한다(기동할 때 검사)
      ratingWeight: 0.4
      salesWeight: 0.2
      wishCap: 1000        # 찜 수가 이만큼이면 찜 항목이 1이다(log 정규화, 넘으면 1). 상한으로 나눠 상품 하나만 다시 색인해도 점수가 맞는다
      salesCap: 500        # 최근 판매량이 이만큼이면 판매 항목이 1이다
      ratingPriorMean: 4.0 # 별점 베이지안 사전 평균. 리뷰가 적은 상품의 평균을 이쪽으로 당긴다
      ratingPriorCount: 5  # 사전값의 무게(리뷰 수). 별점 항목에는 신뢰도 리뷰 수/(리뷰 수 + 이 값)를 곱해, 리뷰가 없으면 0이다
      salesWindowDays: 30  # 판매량 집계 구간(일). 결제 시각 기준, 결제 뒤 취소·반품된 주문은 뺀다
      metricsIntervalSeconds: 60   # 판매량이 바뀐 상품(결제·취소·반품, 집계 구간 밖으로 나간 판매)을 찾아 다시 색인을 요청하는 간격(초)
      metricsOverlapSeconds: 30    # 위 조회를 지난 실행 시각보다 이만큼 앞부터 한다. 주문 상태 변경은 자기 이벤트가 없어 커밋 지연으로 놓치지 않게 겹쳐 읽는다
      metricsLookbackMinutes: 1440 # 앱을 띄운 뒤 첫 실행만 이만큼(하루) 돌아본다. 재시작·배포·장애로 멈춘 동안 바뀐 판매량을 채운다. 더 오래 멈췄으면 관리자 재색인으로 맞춘다
    similar:               # 비슷한 상품 점수 = textWeight·텍스트 + categoryWeight·같은 소분류 + priceWeight·가격 근접도 + behaviorWeight·행동 점수 (각 0~1)
      textWeight: 0.35     # 상품명·설명의 형태소 유사도 (후보 중 최고 점수로 나눈다). 가중치 합은 1이어야 한다(기동할 때 검사)
      categoryWeight: 0.2  # 같은 소분류면 1 (후보는 같은 대분류에서만 찾는다)
      priceWeight: 0.15    # 작은 가격/큰 가격. 절반·두 배면 0.5
      behaviorWeight: 0.3  # 색인한 행동 점수(찜·별점·판매량)
      candidateSize: 50    # 텍스트 후보와 같은 소분류 인기 후보를 각각 이만큼까지 가져와 점수를 매긴다
    recommend:             # 개인화 추천 (회원님을 위한 추천·기준 상품별 섹션·최근 본 상품 기반)
      highRatingWeight: 1.2   # 기준 상품 출처 가중치: 별점 높게 준 상품 > 구매 > 찜 > 장바구니
      purchaseWeight: 1.0
      wishWeight: 0.7
      cartWeight: 0.5
      highRatingMin: 4        # 이 별점 이상이면 높게 평가한 상품(기준 상품)
      lowRatingMax: 2         # 이 별점 이하면 기준에서 빼고 추천 결과에서도 뺀다(싫어한 상품과 비슷한 추천을 막는다)
      halfLifeDays: 30        # 행동 가중치 반감기(일). 이만큼 지난 행동은 절반만 친다
      purchaseDays: 180       # 이만큼(일) 전까지의 구매만 본다
      seedCount: 5            # 기준 상품 최대 수(가중치 상위). 기준 상품마다 ES 질의를 하나씩 한다
      textWeight: 0.35        # 점수 = text·텍스트 + category·선호 소분류 + price·가격대 + behavior·행동 점수 (합 1, 기동할 때 검사)
      categoryWeight: 0.2
      priceWeight: 0.15
      behaviorWeight: 0.3
      candidatePerSeed: 30    # 기준 상품 하나당 텍스트 후보 수
      preferredCandidateSize: 50   # 선호 소분류(기준 상품의 소분류) 인기 후보 수
      sellerMax: 3            # 한 목록에 같은 판매자 상품 최대 수
      forYouStoreSize: 50     # 저장하는 회원님을 위한 추천 수 (읽을 때 걸러지는 상품을 생각해 넉넉히)
      sectionCount: 3         # 기준 상품별 섹션 수 (최근 구매·높게 평가한 상품·최근 찜 순으로 고른다)
      sectionStoreSize: 20    # 섹션 하나에 저장하는 상품 수 (보여 주는 것은 10개)
      staleMinutes: 60        # 저장한 결과가 이만큼(분) 지나면 돌려준 뒤 뒤에서 다시 계산한다(이벤트가 없는 장바구니·주문 취소)
      ttlDays: 7              # 저장한 결과의 TTL(일). 오래 활동이 없는 회원은 사라지고 다음 요청 때 다시 계산한다
      recentViewMax: 20       # 최근 본 상품으로 받는 최대 ID 수
    popularKeyword:
      windowHours: 168     # 인기 검색어 집계 구간(시간). 최근 이만큼의 시간 단위 키를 합친다
      halfLifeHours: 3    # 반감기(시간). 이만큼 지난 시간의 검색은 절반만 센다(가중치 2^(-지난 시간/반감기)). 작을수록 최근 검색에 민감하다
      minScore: 0         # 감쇠한 점수가 이보다 작은 검색어는 순위에서 뺀다. 지금은 검색량이 적어 끈다(0: 구간 안에 한 번이라도 검색되면 후보).
                          # 검색량이 늘어 오래전 한두 번 검색이 순위를 채우는 게 문제가 되면 올린다 (예: 1이면 최근 몇 시간 안에 두 번 이상)
      limit: 10           # 보여 주는 인기 검색어 수
      maxLength: 30       # 이보다 긴 검색어(정규화 뒤 글자 수)는 세지 않는다
      cacheSeconds: 60    # 합친 순위를 이만큼(초) 캐시한다. 새 검색이 순위에 반영되기까지 최대 이만큼 늦어진다
    image:
      maxDetailImages: 10      # 상품 하나의 상세 이미지 최대 개수 (대표 이미지는 별도 1개)
      storage: ${PRODUCT_IMAGE_STORAGE:local}   # 이미지 저장소: local(로컬 파일 시스템, 로컬 개발·테스트) | s3(S3 버킷, 배포 환경)
      localDir: ${PRODUCT_IMAGE_DIR:./uploads}                          # local 저장 폴더 (Git에 올리지 않는다)
      baseUrl: ${PRODUCT_IMAGE_BASE_URL:http://localhost:8082/images}   # local 이미지 URL 앞부분. 앱이 /images/**로 파일을 내려 준다
      # s3 저장소 설정 (storage가 s3일 때만 쓴다). 인증은 액세스 키 없이 EC2 IAM 역할로 한다
      s3:
        bucket: ${PRODUCT_IMAGE_S3_BUCKET:}                  # 버킷 이름
        region: ${PRODUCT_IMAGE_S3_REGION:ap-northeast-2}    # 버킷 리전 (서울)
        baseUrl: ${PRODUCT_IMAGE_S3_BASE_URL:}               # 이미지 URL 앞부분 (예: https://{버킷}.s3.ap-northeast-2.amazonaws.com)
  # 회원 내부 API(/internal/v1/members·sellers). member-service(8081)
  member:
    baseUrl: ${MEMBER_SERVICE_URL:http://localhost:8081}
    connectTimeoutMillis: 1000   # 회원 서비스 접속 제한 시간(밀리초)
    readTimeoutMillis: 3000      # 응답 대기 제한 시간(밀리초). 장바구니·주문 요청 안에서 부르므로 짧게 둔다
  # 배송 내부 API(/internal/v1/deliveries). delivery-service(8085). 주문 상세의 배송 정보 조회에 쓴다
  # 응답하지 못하면 주문 상세는 배송 정보 없이(deliveryUnavailable: true) 응답한다
  delivery:
    baseUrl: ${DELIVERY_SERVICE_URL:http://localhost:8085}
    connectTimeoutMillis: 1000   # delivery 서비스 접속 제한 시간(밀리초)
    readTimeoutMillis: 2000      # 응답 대기 제한 시간(밀리초). 주문 상세 요청 안에서 부르므로 짧게 둔다
  # 결제 내부 API(/internal/v1/payments). payment-service(8083). 주문 결제(pay)·결제 취소(cancelPayment)·결제 내역 조회
  # pay가 응답 시간 안에 오지 않으면 결과 불명으로 보고 주문을 PAYING으로 둔다. 재확인 스케줄러가 같은 키로 다시 불러 정리한다
  # 결제 내역 조회가 실패하면 주문 상세는 결제 내역 없이(paymentUnavailable: true) 응답한다
  payment:
    baseUrl: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    connectTimeoutMillis: 1000   # payment 서비스 접속 제한 시간(밀리초)
    readTimeoutMillis: 5000      # 결제 요청(pay·결제 취소) 응답 대기 제한 시간(밀리초). 결제는 지갑 잠금을 기다릴 수 있어 다른 조회보다 길게 둔다. payingRecheckSeconds보다 짧아야 한다
    queryReadTimeoutMillis: 2000 # 결제 내역 조회 응답 대기 제한 시간(밀리초). 주문 상세 요청 안에서 부르므로 짧게 둔다
  order:
    cartMaxQuantity: 99       # 장바구니 최대 수량
    expireMinutes: 15          # 주문 생성 후 결제 제한 시간(분)
    autoConfirmDays: 7         # 배송 완료 후(배송지 없는 주문은 결제 후) 자동 구매 확정(일)
    autoConfirmIntervalSeconds: 3600   # 자동 구매 확정 스케줄러 실행 간격(초). 7일 경과 후 최대 이 시간만큼 늦게 확정된다
    schedulerBatchSize: 100            # 주문 스케줄러(자동 구매 확정·결제 만료)가 한 번에 조회하는 주문 수
    expireGraceMinutes: 1              # 결제 만료 시각 후 만료 취소까지 기다리는 시간(분)
    expireIntervalSeconds: 60          # 결제 만료 취소 스케줄러 실행 간격(초)
    payingRecheckSeconds: 30           # 결제 중(PAYING)이 된 뒤 이 시간(초)이 지나면 재확인 스케줄러가 같은 키로 결제를 다시 불러 정리한다
    payingRecheckIntervalSeconds: 30   # 결제 재확인 스케줄러 실행 간격(초). 한 번에 schedulerBatchSize건씩 처리한다
    payingAlertMinutes: 10             # 결제 중 상태가 이 시간(분) 넘게 정리되지 않으면 ERROR 로그로 알린다
    refundCheckSeconds: 60             # 반품 승인 뒤 이 시간(초)이 지나면 환불 확인 스케줄러가 결제 서비스에 환불 여부를 확인한다
    refundCheckIntervalSeconds: 300    # 반품 환불 확인 스케줄러 실행 간격(초)
    refundAlertMinutes: 60             # 반품 승인 후 이 시간(분)이 지나도 환불되지 않으면 ERROR 로그로 알린다(돈이 홀딩에 남아 있음)
    couponEnabled: ${ORDER_COUPON_ENABLED:true}   # 주문에 쿠폰을 반영하는지. 결제(장바구니 쿠폰 지원금), 정산(상품 쿠폰 할인 후 금액), 반품 환불(지원금 회수)이 지원해 켠다. 문제가 생기면 ORDER_COUPON_ENABLED=false로 바로 끈다
    shippingFee: 2500                  # 배송비(원). 주문당 한 번
    freeShippingThreshold: 30000       # 무료 배송 기준(원). 상품 쿠폰 할인 후 상품 금액 합계가 이 금액 이상이면 배송비 0 (장바구니 쿠폰은 기준에 영향 없음)
  outbox:
    relayEnabled: true          # false면 릴레이 스케줄러를 등록하지 않는다(테스트에서 끔: src/test/resources/application.properties)
    relayIntervalMillis: 1000   # Outbox 릴레이 실행 간격(밀리초). 이벤트가 리스너에 닿기까지 최대 이만큼 늦어진다
    relayBatchSize: 100         # 릴레이가 한 번에 발행하는 최대 이벤트 수
    maxRetryCount: 5            # 발행 실패를 이 횟수만큼 겪으면 FAILED로 두고 더 이상 발행하지 않는다(Kafka가 내려가 있는 건 세지 않음)
    sendTimeoutMillis: 10000    # Kafka 브로커의 기록 확인(ack)을 기다리는 최대 시간(밀리초)
    topicPartitions: 3          # 이벤트 토픽(<대상>.events) 파티션 수. 같은 aggregateId는 같은 파티션으로 가서 순서가 지켜진다
  kafka:
    consumer:
      # 컨슈머가 실패한 메시지를 다시 처리하는 방식. 기본값이면 1·2·4·8초 간격으로 4번 더 처리하고(총 5번), 그래도 실패하면 <토픽>-dlt로 보낸다
      maxRetries: 4                     # 처음 처리 뒤 다시 처리하는 횟수
      retryInitialIntervalMillis: 1000  # 첫 재시도 전 대기(밀리초)
      retryMultiplier: 2.0              # 재시도마다 대기 시간에 곱하는 값
  scheduling:
    enabled: true        # false면 모든 스케줄러가 멈춘다(통합 테스트용)
