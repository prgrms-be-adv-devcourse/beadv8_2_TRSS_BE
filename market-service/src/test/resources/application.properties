# 테스트 전용 설정. main의 application.yaml에 더해 함께 읽힌다.
# 릴레이 스케줄러를 끈다. 켜 두면 스케줄러가 켜진 테스트 컨텍스트의 릴레이가 다른 테스트가 막 저장한 PENDING 이벤트를 먼저 발행해 버린다.
# 릴레이가 필요한 테스트는 OutboxRelay.relayPending()을 직접 부른다.
custom.outbox.relayEnabled=false

# 내부 API 키. 테스트는 .env 없이도 뜨도록 고정 값을 쓴다.
custom.internal.apiKey=test-internal-api-key

# 상품 검색은 DB 검색으로 돌린다. ES 없이 테스트가 통과해야 하므로 ES 색인 리스너·스케줄러도 등록하지 않는다.
custom.product.search.engine=jpa

# 테스트는 Redis 1번 DB를 쓴다. 검색 테스트가 인기 검색어를 실제로 기록하므로, 로컬 개발 데이터(0번 DB)의 인기 검색어에 섞이지 않게 한다.
spring.data.redis.database=1

# 쿼리 수를 세는 테스트용. 테스트가 ThreadQueryCounter.record로 켠 스레드의 SQL만 기록하고, 그 밖에는 아무것도 하지 않는다.
# Hibernate 통계는 앱 전체 값이라 스케줄러 쿼리가 섞이므로 이 방식을 쓴다.
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.backend.boundedContext.product.app.ThreadQueryCounter
