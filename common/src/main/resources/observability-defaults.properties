# 모든 서비스의 관측 기본값(ObservabilityEnvironmentPostProcessor가 가장 낮은 우선순위로 붙임).
# 컨테이너에서는 Dockerfile의 MANAGEMENT_SERVER_PORT=9091로 actuator가 관리 포트에 따로 뜬다(nginx가 넘기지 않음).
# 로컬 bootRun은 앱 포트에 뜬다(앱 7개가 같은 포트를 두고 충돌하지 않게).

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# 전체 히스토그램 대신 버킷 6개(시계열 수를 줄임)
management.metrics.distribution.slo.http.server.requests=50ms,100ms,300ms,500ms,1s,3s

# ── 분산 추적 (TRSS-335) ──
# 요청이 적어 전부 남긴다(기본은 10%). 부하 테스트로 양이 너무 많으면 낮춘다
management.tracing.sampling.probability=1.0
# 지표는 Prometheus가 가져간다(위 /actuator/prometheus). 추적 스타터에 같이 들어오는 OTLP 지표 내보내기는 끈다
management.otlp.metrics.export.enabled=false
# Kafka로 보낼 때 traceId를 메시지 헤더에 넣고, 받을 때 이어 받는다(서비스 지도에 Kafka 선이 생긴다)
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# 추적을 보낼 주소(management.opentelemetry.tracing.export.otlp.endpoint)는 여기 두지 않는다.
# 서버 컨테이너만 Dockerfile 환경변수로 받는다. 주소가 없으면 내보내지 않아 로컬·테스트는 그대로다
