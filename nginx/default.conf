# 외부 요청(80)을 Spring 앱(app:8080)으로 넘기는 리버스 프록시. HTTPS는 도메인을 정한 뒤 추가한다.
upstream app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    server_tokens off;           # 응답 헤더에 nginx 버전을 노출하지 않는다
    client_max_body_size 10m;    # 요청 본문 최대 크기 (상품 이미지 업로드 대비)

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # 토스 응답 대기(30초)보다 길게
    }
}
