# develop 대상 PR마다 빌드와 테스트를 돌려 PR에 결과(✅/❌)를 표시한다.
# develop에 push(머지)된 커밋도 다시 검증한다. 이 실행이 성공하면 Deploy가 그 커밋을 배포한다.
# (PR 실행은 가상 머지 커밋을 테스트해서, 실제 develop 커밋과 SHA가 다르다.)
# 통합 테스트(@SpringBootTest)는 실제 Postgres·Redis가 필요해서 서비스 컨테이너로 띄운다.
# develop push 실행이 실패하면 팀 Slack 채널에 알린다. PR 실행 실패는 PR 화면의 ❌로 확인한다.
#
# 필요한 Secrets: SLACK_BOT_TOKEN(Grafana 알림과 같은 Slack 봇 토큰. 없으면 알림만 건너뛴다)
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
# develop push 실행은 커밋마다 따로 돌고 취소하지 않는다. 각 커밋이 자기 배포 여부를 판단받아야 하기 때문이다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: palette
          POSTGRES_USER: palette
          POSTGRES_PASSWORD: palette
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palette -d palette"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성을 캐시해 두 번째 실행부터 빌드가 빨라진다.
      - uses: gradle/actions/setup-gradle@v4

      # 기본값이 없는 비밀값은 테스트용으로 실행마다 새로 만든다. 실제 서버 값과는 무관하다.
      - name: Generate test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "INTERNAL_API_KEY=$(openssl rand -base64 32)"
            echo "ACCOUNT_ENCRYPTION_PASSWORD=$(openssl rand -base64 32)"
            echo "ACCOUNT_ENCRYPTION_SALT=$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      # 서비스별 스키마·계정(market_user 등)을 만든다. 로컬은 compose가 처음 뜰 때 이 스크립트를 실행하지만,
      # 서비스 컨테이너는 checkout 전에 떠서 스크립트를 넣을 수 없으므로 여기서 직접 실행한다.
      # 비밀번호는 infra/compose.yaml 기본값과 같다 (각 서비스 application.yaml의 기본값과도 같다).
      - name: Init DB schemas
        env:
          PGHOST: localhost
          PGPASSWORD: palette
          POSTGRES_USER: palette
          POSTGRES_DB: palette
          MEMBER_DB_PASSWORD: member_user
          MARKET_DB_PASSWORD: market_user
          PAYMENT_DB_PASSWORD: payment_user
          SETTLEMENT_DB_PASSWORD: settlement_user
          NOTIFICATION_DB_PASSWORD: notification_user
          AI_DB_PASSWORD: ai_user
          READONLY_DB_PASSWORD: readonly_user
        run: bash infra/postgres/init/01-init-schemas.sh

      # 서비스별 스키마와 계정(market_user 등)을 만든다. 서비스 컨테이너에는 init 스크립트를 넣을 수 없어서 직접 실행한다.
      # 비밀번호는 infra/compose.yaml 로컬 기본값과 같다.
      - name: Create service schemas
        env:
          PGHOST: localhost
          PGPASSWORD: palette
          POSTGRES_USER: palette
          POSTGRES_DB: palette
          MEMBER_DB_PASSWORD: member_user
          MARKET_DB_PASSWORD: market_user
          PAYMENT_DB_PASSWORD: payment_user
          SETTLEMENT_DB_PASSWORD: settlement_user
          NOTIFICATION_DB_PASSWORD: notification_user
          AI_DB_PASSWORD: ai_user
          READONLY_DB_PASSWORD: readonly_user
        run: bash infra/postgres/init/01-init-schemas.sh

      # 컴파일 + 테스트 + jar 생성. DB·Redis 접속 정보는 application.yaml 기본값(localhost)을 쓴다.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # 실패하면 테스트 리포트를 내려받아 원인을 볼 수 있게 남긴다 (Actions 실행 화면의 Artifacts).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            */build/reports/tests/test
          retention-days: 7

      # 커밋 메시지 같은 값은 run에 직접 넣지 않고 env로 넘긴다 (셸 명령으로 해석되지 않게).
      # Slack 전송이 실패해도 CI 결과는 바꾸지 않고 경고만 남긴다.
      - name: Notify Slack on develop failure
        if: failure() && github.event_name == 'push'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0C3CMPUP2B   # 팀 알림 채널 (infra/monitoring/grafana/provisioning/alerting/slack.yaml과 같은 채널)
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::warning::SLACK_BOT_TOKEN이 없어 Slack 알림을 건너뜁니다"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg msg "${COMMIT_MESSAGE%%$'\n'*}" \
            --arg author "$COMMIT_AUTHOR" \
            --arg url "$RUN_URL" \
            '{channel: $channel,
              text: ("❌ *[CI] develop 빌드 실패*\n• 커밋: `" + $sha + "` " + $msg + " (" + $author + ")\n• <" + $url + "|Actions 로그 보기>")}')
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD")
          if [ "$(jq -r '.ok' <<< "$RESPONSE")" != "true" ]; then
            echo "::warning::Slack 알림 전송 실패: $(jq -r '.error' <<< "$RESPONSE")"
          fi
