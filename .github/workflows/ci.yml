# develop 대상 PR마다 빌드와 테스트를 돌려 PR에 결과(✅/❌)를 표시한다.
# 통합 테스트(@SpringBootTest)는 실제 Postgres·Redis가 필요해서 서비스 컨테이너로 띄운다.
name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: palette
          POSTGRES_USER: palette
          POSTGRES_PASSWORD: palette
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palette -d palette"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성을 캐시해 두 번째 실행부터 빌드가 빨라진다.
      - uses: gradle/actions/setup-gradle@v4

      # 기본값이 없는 비밀값은 테스트용으로 실행마다 새로 만든다. 실제 서버 값과는 무관하다.
      - name: Generate test secrets
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "ACCOUNT_ENCRYPTION_PASSWORD=$(openssl rand -base64 32)"
            echo "ACCOUNT_ENCRYPTION_SALT=$(openssl rand -hex 8)"
          } >> "$GITHUB_ENV"

      # 컴파일 + 테스트 + jar 생성. DB·Redis 접속 정보는 application.yaml 기본값(localhost)을 쓴다.
      - name: Build and test
        run: ./gradlew build --no-daemon

      # 실패하면 테스트 리포트를 내려받아 원인을 볼 수 있게 남긴다 (Actions 실행 화면의 Artifacts).
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
