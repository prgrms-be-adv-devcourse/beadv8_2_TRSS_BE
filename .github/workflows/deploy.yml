# develop push로 돈 CI가 성공하면, CI가 테스트한 바로 그 커밋(head_sha)을 개발 서버(EC2)에 배포한다.
# CI가 실패했거나 PR에서 돈 CI는 배포하지 않는다.
# 배포 전용 키로 SSH 접속하며 "deploy <SHA>"만 넘긴다. 서버의 authorized_keys가 이 키로 실행할 명령을
# infra/scripts/deploy-remote.sh로 고정해 두어서, 키가 유출돼도 develop에 있는 커밋 배포 말고는 할 수 없다.
# 수동 재배포: Actions 탭에서 해당 Deploy 실행을 Re-run 하면 같은 커밋을 다시 배포한다.
# 배포가 실패하면(SSH 접속, 서버의 앱 실행 확인 실패 등) 팀 Slack 채널에 실패한 단계·원인과 함께 알린다.
#
# 필요한 Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY(배포 전용 비밀키), EC2_KNOWN_HOSTS(서버 지문),
#   SLACK_BOT_TOKEN(Grafana 알림과 같은 Slack 봇 토큰. 없으면 알림만 건너뛴다)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 다음 배포가 기다린다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # develop push로 돈 CI가 성공했을 때만 배포한다.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # 서버 빌드(약 4분) + 앱 실행 확인 상한(deploy.sh, 10분)보다 길게. 짧으면 Actions가 먼저 끊어 실패 원인이 남지 않는다
    timeout-minutes: 20

    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버 지문을 미리 고정해, 접속한 서버가 진짜 우리 서버인지 확인한다.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to dev server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "▶ 배포할 커밋: $DEPLOY_SHA"
          # 서버 출력을 화면에 보여 주면서 파일에도 남긴다. 실패하면 Slack 단계가 여기서 "❌ 단계/원인" 줄을 꺼낸다
          LOG="$RUNNER_TEMP/deploy-output.log"
          set +e
          # 넘긴 명령은 서버에서 $SSH_ORIGINAL_COMMAND로 받는다 (infra/scripts/deploy-remote.sh가 검증).
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "deploy $DEPLOY_SHA" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          # ssh는 접속 자체에 실패하면 255를 돌려준다. 서버 스크립트가 원인을 남기지 못한 경우라 여기서 적는다
          if [ "$rc" -eq 255 ] && ! grep -q '^❌ 단계: ' "$LOG"; then
            printf '❌ 단계: SSH 접속\n❌ 원인: 서버에 접속하지 못했습니다\n' | tee -a "$LOG"
          fi
          exit "$rc"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # 커밋 메시지 같은 값은 run에 직접 넣지 않고 env로 넘긴다 (셸 명령으로 해석되지 않게).
      # Slack 전송이 실패해도 배포 결과는 바꾸지 않고 경고만 남긴다.
      - name: Notify Slack on deploy failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0C3CMPUP2B   # 팀 알림 채널 (infra/monitoring/grafana/provisioning/alerting/slack.yaml과 같은 채널)
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::warning::SLACK_BOT_TOKEN이 없어 Slack 알림을 건너뜁니다"
            exit 0
          fi
          # 서버 스크립트(deploy-remote.sh, deploy.sh)가 남긴 마지막 "❌ 단계/원인" 줄. 없으면(SSH 키 설정 실패 등) 로그를 보게 한다
          LOG="$RUNNER_TEMP/deploy-output.log"
          STAGE=$(grep '^❌ 단계: ' "$LOG" 2>/dev/null | tail -1 | sed 's/^❌ 단계: //')
          REASON=$(grep '^❌ 원인: ' "$LOG" 2>/dev/null | tail -1 | sed 's/^❌ 원인: //')
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg msg "${COMMIT_MESSAGE%%$'\n'*}" \
            --arg author "$COMMIT_AUTHOR" \
            --arg stage "${STAGE:-알 수 없음}" \
            --arg reason "${REASON:-원인을 찾지 못했습니다. Actions 로그를 확인하세요}" \
            --arg url "$RUN_URL" \
            '{channel: $channel,
              text: ("❌ *[Deploy] 개발 서버 배포 실패*\n• 커밋: `" + $sha + "` " + $msg + " (" + $author + ")\n• 단계: " + $stage + "\n• 원인: " + $reason + "\n• <" + $url + "|Actions 로그 보기>")}')
          RESPONSE=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD")
          if [ "$(jq -r '.ok' <<< "$RESPONSE")" != "true" ]; then
            echo "::warning::Slack 알림 전송 실패: $(jq -r '.error' <<< "$RESPONSE")"
          fi
