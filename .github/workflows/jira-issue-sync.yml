name: Sync GitHub Issue to Jira

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Issue의 Issue Type 조회
      - name: Get GitHub issue type
        id: github-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TYPE=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
            --jq '.type.name // "Feature"')

          echo "GitHub Issue Type: $ISSUE_TYPE"
          echo "issue_type=$ISSUE_TYPE" >> "$GITHUB_OUTPUT"

      # 2. GitHub Issue Type을 Jira Work Type으로 변환
      #
      # GitHub Feature → Jira Feature
      # GitHub Task    → Jira Task
      # GitHub Bug     → Jira Bug
      #
      # Issue Type이 없거나 예상하지 못한 값이면 Feature로 처리
      - name: Map GitHub issue type to Jira work type
        id: jira-type
        env:
          GH_ISSUE_TYPE: ${{ steps.github-issue.outputs.issue_type }}
        run: |
          case "$GH_ISSUE_TYPE" in
            "Bug")
              JIRA_ISSUE_TYPE="Bug"
              ;;
            "Feature")
              JIRA_ISSUE_TYPE="Feature"
              ;;
            "Task")
              JIRA_ISSUE_TYPE="Task"
              ;;
            *)
              JIRA_ISSUE_TYPE="Feature"
              ;;
          esac

          echo "GitHub Issue Type: $GH_ISSUE_TYPE"
          echo "Jira Work Type: $JIRA_ISSUE_TYPE"

          echo "jira_issue_type=$JIRA_ISSUE_TYPE" >> "$GITHUB_OUTPUT"

      # 3. GitHub Issue의 첫 번째 Assignee를 Jira accountId로 변환
      #
      # GitHub에는 여러 명의 Assignee를 지정할 수 있지만
      # Jira 기본 Assignee는 한 명만 지정할 수 있으므로
      # 첫 번째 GitHub Assignee를 Jira 담당자로 사용
      - name: Map GitHub assignee to Jira account
        id: jira-assignee
        env:
          GH_ASSIGNEE: ${{ github.event.issue.assignees[0].login }}
        run: |
          case "$GH_ASSIGNEE" in
            "Kejeong")
              JIRA_ACCOUNT_ID="712020:32fa664a-4169-4e52-a909-d0096cfaa958"
              ;;
            "lee-si-yeon")
              JIRA_ACCOUNT_ID="712020:07003c8d-68a3-4e59-9aaf-8561c709c02d"
              ;;
            "JieunYume")
              JIRA_ACCOUNT_ID="712020:9a60d33d-6cb4-4909-ae4d-2a0c810ec007"
              ;;
            "dekim2018")
              JIRA_ACCOUNT_ID="712020:1f6eb01d-7e4d-4964-a5c0-1b415299cda8"
              ;;
            "yuj118")
              JIRA_ACCOUNT_ID="712020:43bb9aea-6a4e-4669-a1e3-d7b907af82ac"
              ;;
            *)
              JIRA_ACCOUNT_ID=""
              ;;
          esac

          echo "GitHub Assignee: ${GH_ASSIGNEE:-none}"

          if [ -n "$JIRA_ACCOUNT_ID" ]; then
            echo "Jira Assignee mapped"
          else
            echo "Jira Assignee not mapped"
          fi

          echo "jira_account_id=$JIRA_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      # 4. Scoped Jira API Token 사용을 위한 Jira Cloud ID 조회
      - name: Get Jira Cloud ID
        id: jira-cloud
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          CLOUD_ID=$(curl --fail --silent \
            "${JIRA_BASE_URL}/_edge/tenant_info" \
            | jq -r '.cloudId')

          if [ -z "$CLOUD_ID" ] || [ "$CLOUD_ID" = "null" ]; then
            echo "Failed to get Jira Cloud ID"
            exit 1
          fi

          echo "cloud_id=$CLOUD_ID" >> "$GITHUB_OUTPUT"

      # 5. GitHub Issue를 기반으로 Jira 업무 생성
      - name: Create Jira issue
        id: create-jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CLOUD_ID: ${{ steps.jira-cloud.outputs.cloud_id }}

          GH_ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_ISSUE_BODY: ${{ github.event.issue.body }}
          GH_ISSUE_URL: ${{ github.event.issue.html_url }}

          JIRA_ISSUE_TYPE: ${{ steps.jira-type.outputs.jira_issue_type }}
          JIRA_ACCOUNT_ID: ${{ steps.jira-assignee.outputs.jira_account_id }}

        run: |
          ISSUE_BODY="${GH_ISSUE_BODY:-내용 없음}"

          # 담당자가 정상적으로 매핑된 경우에만
          # Jira assignee 필드를 요청에 포함
          if [ -n "$JIRA_ACCOUNT_ID" ]; then
            ASSIGNEE_FIELD=$(jq -n \
              --arg accountId "$JIRA_ACCOUNT_ID" \
              '{assignee: {accountId: $accountId}}')
          else
            ASSIGNEE_FIELD='{}'
          fi

          # Jira Create Issue API Payload 생성
          PAYLOAD=$(jq -n \
            --arg title "$GH_ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg url "$GH_ISSUE_URL" \
            --arg issueType "$JIRA_ISSUE_TYPE" \
            --argjson assignee "$ASSIGNEE_FIELD" \
            '{
              fields: (
                {
                  project: {
                    key: "TRSS"
                  },
                  summary: $title,
                  issuetype: {
                    name: $issueType
                  },
                  description: {
                    type: "doc",
                    version: 1,
                    content: [
                      {
                        type: "paragraph",
                        content: [
                          {
                            type: "text",
                            text: $body
                          }
                        ]
                      },
                      {
                        type: "paragraph",
                        content: [
                          {
                            type: "text",
                            text: ("GitHub Issue: " + $url)
                          }
                        ]
                      }
                    ]
                  }
                } + $assignee
              )
            }')

          # Jira API 호출
          # HTTP Status와 Response Body를 분리해서 저장
          HTTP_STATUS=$(curl --silent \
            --output jira-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://api.atlassian.com/ex/jira/${CLOUD_ID}/rest/api/3/issue" \
            --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")

          echo "Jira HTTP Status: $HTTP_STATUS"
          echo "Jira Response:"
          cat jira-response.json
          echo ""

          # HTTP 2xx가 아니면 Jira 응답을 출력한 뒤 실패 처리
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Failed to create Jira issue"
            exit 1
          fi

          JIRA_KEY=$(jq -r '.key' jira-response.json)

          if [ -z "$JIRA_KEY" ] || [ "$JIRA_KEY" = "null" ]; then
            echo "Jira issue was created but Jira key was not returned"
            exit 1
          fi

          echo "jira_key=$JIRA_KEY" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $JIRA_KEY"

      # 6. 생성된 Jira Ticket Number를 원래 GitHub Issue에 댓글로 작성
      - name: Comment Jira ticket on GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_KEY: ${{ steps.create-jira.outputs.jira_key }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🎫 Jira Ticket: **${JIRA_KEY}**"
