services:
  postgres:
    image: postgres:17
    container_name: palette-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-palette}
      POSTGRES_USER: ${DB_USERNAME:-palette}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palette}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: palette-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
