server:
  port: ${MEMBER_PORT:8081}   # 로컬에서 루트 모놀리스(8080)와 같이 띄울 수 있게 다른 포트를 쓴다

spring:
  application:
    name: member-service

  # 프로젝트 루트의 .env를 읽음 (없으면 무시). bootRun은 모듈 폴더에서 실행되므로 상위 폴더도 찾는다
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # member 스키마만 쓴다. 운영에서는 member_user(자기 스키마 권한만 가진 계정)로 접속한다
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:palette}?currentSchema=member
    username: ${MEMBER_DB_USERNAME:${DB_USERNAME:member_user}}
    password: ${MEMBER_DB_PASSWORD:${DB_PASSWORD:member_user}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)로만 바꾸고, 엔티티와 다르면 앱 시작을 막는다.

  flyway:
    schemas: member
    default-schema: member
    # 운영 DB: 테이블을 public에서 member로 옮긴 뒤 처음 뜰 때 V1(baseline)은 이미 적용된 것으로 기록하고 V2부터 실행한다
    #   V1의 테이블이 member에 모두 있어야 한다. 옮기지 못하는 outbox_event·processed_event 처리 등 이전 절차는 V1 파일 주석 참고
    # 빈 DB(로컬·CI·새 서버): V1부터 실행한다
    baseline-on-migrate: true
    baseline-version: 1

  data:
    # 이메일 인증코드·인증 완료 토큰·로그인 실패 횟수·Refresh Token
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Outbox 릴레이가 이벤트 봉투를 발행하는 Kafka. 회원은 member.events(가입), seller.events(판매자 제재·철회)를 발행한다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                   # 브로커가 기록을 마친 뒤에 성공으로 본다(그때 outbox를 PUBLISHED로 바꿈)
      properties:
        enable.idempotence: true  # 프로듀서 재시도로 같은 메시지가 두 번 기록되지 않게
        max.block.ms: 5000        # 브로커가 없을 때 send가 오래 막히지 않게(기본 60초)
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record            # 메시지 하나를 처리(커밋)한 뒤에 offset을 커밋한다

  # 인증 메일 발송(Gmail SMTP). 계정 정보는 환경변수로 주입하고, 없으면 발송할 때만 실패한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  task:
    scheduling:
      pool:
        size: 1          # 스케줄 작업은 outbox 릴레이 하나


# 정책 값. 코드에 숫자를 직접 쓰지 않고 각 컨텍스트의 <Ctx>Policy에서 읽는다.
custom:
  jwt:
    # 서명 키: 모든 서비스가 같은 값을 쓴다. 기본값 없이 환경변수(.env)로만 주입한다.
    secret: ${JWT_SECRET}
    accessTokenExpireMinutes: 30          # Access Token 유효 시간(분)
  internal:
    # 서비스 간 호출(/internal/**) 인증 키. X-Internal-Key 헤더로 보낸다. 모든 서비스가 같은 값을 쓰고, 기본값 없이 환경변수(.env)로만 주입한다.
    # 회원이 받는 내부 API(/internal/v1/members·sellers) 검사와 다른 서비스 내부 API 호출(Member*HttpAdapter)에 함께 쓴다
    apiKey: ${INTERNAL_API_KEY}
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}   # 프론트 주소(쉼표로 구분)
  member:
    refreshTokenExpireDays: 14            # Refresh Token 유효 기간(일)
    seedPassword: ${MEMBER_SEED_PASSWORD:}   # 개발용 시드 회원 비밀번호. 비어 있으면 시드를 넣지 않는다(운영 환경)
    refreshCookieSecure: ${AUTH_COOKIE_SECURE:false}       # HTTPS 배포 시 true
    refreshCookieSameSite: ${AUTH_COOKIE_SAME_SITE:Lax}    # 프론트·백엔드 도메인이 다르면 None (Secure 필수)
    emailCodeExpireMinutes: 5             # 이메일 인증코드 유효 시간(분)
    emailCodeResendSeconds: 60            # 인증코드 재발송 제한 간격(초)
    emailVerifiedTokenExpireMinutes: 30   # 인증 완료 토큰 유효 시간(분)
    emailCodeMaxAttempts: 5               # 인증코드 확인 최대 실패 횟수
    loginMaxAttempts: 5                   # 로그인 최대 실패 횟수 (도달하면 잠금)
    loginLockMinutes: 15                  # 로그인 실패를 세는 기간이자 잠금 시간(분)
    # 정산 계좌번호 암호화 키. 기본값 없이 환경변수(.env)로만 주입한다.
    accountEncryption:
      password: ${ACCOUNT_ENCRYPTION_PASSWORD}
      salt: ${ACCOUNT_ENCRYPTION_SALT}
  # 카카오 로그인(이미 가입한 회원이 카카오 계정을 연결해 로그인 수단으로 씀). 프론트가 받은 인가 코드를 서버가 토큰으로 바꿔 회원번호를 조회한다.
  # Client Secret은 환경변수로만 주입하고, 키가 없으면 카카오를 호출할 때만 실패한다.
  kakao:
    authBaseUrl: https://kauth.kakao.com    # 토큰 발급
    apiBaseUrl: https://kapi.kakao.com      # 사용자 정보 조회
    clientId: ${KAKAO_CLIENT_ID:}           # REST API 키 (프론트 인가 주소에도 들어가는 공개 값)
    clientSecret: ${KAKAO_CLIENT_SECRET:}
    redirectUri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao/callback}   # 프론트 콜백 화면. 인가 요청 때와 같아야 토큰을 받을 수 있다
    connectTimeoutSeconds: 3
    readTimeoutSeconds: 5
  # 회원이 부르는 다른 서비스 내부 API (Member*HttpAdapter). 사용자 요청 안에서 부르므로 응답 대기를 짧게 둔다
  market:
    # 주문·상품(market-service). 주문 내부 API(/internal/v1/orders): 탈퇴 검사, 판매자 철회 승인, 관리자 회원 상세
    baseUrl: ${MARKET_SERVICE_URL:http://localhost:8082}
    connectTimeoutMillis: 1000   # 접속 제한 시간(밀리초)
    readTimeoutMillis: 3000      # 응답 대기 제한 시간(밀리초)
  settlement:
    # 정산(settlement-service). 정산 내부 API(/internal/v1/settlements): 탈퇴 검사, 판매자 철회 요청·승인, 내 판매자 정보
    baseUrl: ${SETTLEMENT_SERVICE_URL:http://localhost:8084}
    connectTimeoutMillis: 1000
    readTimeoutMillis: 3000
  payment:
    # 결제(payment-service). 결제 내부 API(/internal/v1/payments): 탈퇴 검사, 관리자 회원 상세
    baseUrl: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    connectTimeoutMillis: 1000
    readTimeoutMillis: 3000
  outbox:
    relayEnabled: true          # false면 릴레이 스케줄러를 등록하지 않는다(테스트에서 끔: src/test/resources/application.properties)
    relayIntervalMillis: 1000   # Outbox 릴레이 실행 간격(밀리초). 이벤트가 Kafka에 닿기까지 최대 이만큼 늦어진다
    relayBatchSize: 100         # 릴레이가 한 번에 발행하는 최대 이벤트 수
    maxRetryCount: 5            # 발행 실패를 이 횟수만큼 겪으면 FAILED로 두고 더 이상 발행하지 않는다(Kafka가 내려가 있는 건 세지 않음)
    sendTimeoutMillis: 10000    # Kafka 브로커의 기록 확인(ack)을 기다리는 최대 시간(밀리초)
    topicPartitions: 3          # 이벤트 토픽(<대상>.events) 파티션 수. 같은 aggregateId는 같은 파티션으로 가서 순서가 지켜진다
  kafka:
    consumer:
      # 컨슈머가 실패한 메시지를 다시 처리하는 방식. 회원은 지금 받는 이벤트가 없지만 공통 설정(KafkaConsumerConfig)이 읽는다
      maxRetries: 4                     # 처음 처리 뒤 다시 처리하는 횟수
      retryInitialIntervalMillis: 1000  # 첫 재시도 전 대기(밀리초)
      retryMultiplier: 2.0              # 재시도마다 대기 시간에 곱하는 값
  scheduling:
    enabled: true        # false면 모든 스케줄러(outbox 릴레이)가 멈춘다(통합 테스트용)
